name: 极速验证打包流程

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 初始化环境 (本地造假包，免下载)
        run: |
          mkdir -p openwrt/bin/targets/armsr/armv8
          mkdir -p inject/opt/bin inject/etc/hotplug.d/usb inject/etc/uci-defaults
          
          # 1. 伪造注入文件
          echo "echo 'dummy'" > inject/opt/bin/usb_modeswitch
          chmod +x inject/opt/bin/usb_modeswitch
          echo "echo 'dummy'" > inject/etc/hotplug.d/usb/99-aic8800
          chmod +x inject/etc/hotplug.d/usb/99-aic8800
          echo "echo 'dummy'" > inject/etc/uci-defaults/99-zh-cn
          chmod +x inject/etc/uci-defaults/99-zh-cn
          
          # 2. 伪造一个极简的 rootfs 目录结构
          mkdir -p fake_rootfs
          mkdir -p fake_rootfs/bin fake_rootfs/sbin fake_rootfs/etc fake_rootfs/lib fake_rootfs/usr fake_rootfs/www
          echo "#!/bin/sh" > fake_rootfs/sbin/init
          chmod +x fake_rootfs/sbin/init
          echo "OpenWrt" > fake_rootfs/etc/openwrt_release
          
          # 3. 打包成 tar.gz 伪装成编译好的 OpenWrt rootfs
          echo "生成假 rootfs.tar.gz..."
          tar czf openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz -C fake_rootfs .
          
          # 4. 伪造环境变量
          echo "KV=6.12.999" >> $GITHUB_ENV

      - name: 临时修复 cp --update 兼容性 Bug
        run: |
          sudo mv /usr/bin/cp /usr/bin/cp.orig
          sudo tee /usr/bin/cp > /dev/null <<'EOF'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" == "--update" ]]; then
              args+=("-n")
            elif [[ "$arg" == --update=* ]]; then
              args+=("-n")
            else
              args+=("$arg")
            fi
          done
          exec /usr/bin/cp.orig "${args[@]}"
          EOF
          sudo chmod +x /usr/bin/cp

      - name: 打包 N1 固件 (测试)
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/*/*/*rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ${{ github.repository }}
          openwrt_kernel: ${{ env.KV }}
          auto_kernel: false
          openwrt_files: inject

      - name: 恢复系统默认 cp 命令
        if: always()
        run: |
          if [ -f /usr/bin/cp.orig ]; then
            sudo mv /usr/bin/cp.orig /usr/bin/cp
          fi

      - name: 检查产物是否存在
        run: |
          echo "查找生成的固件..."
          ls -lah ${{ env.PACKAGED_OUTPUTPATH }}/ || echo "目录不存在"
          if ls ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz 1> /dev/null 2>&1; then
            echo "✅ 验证成功！固件生成正常。"
          else
            echo "❌ 验证失败！未找到固件产物。"
            exit 1
          fi
