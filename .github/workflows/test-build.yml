name: 测试 ophub 内核资产与 OpenWrt 版本匹配性

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本分支'
        required: true
        default: 'v24.10.2'
        type: string

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: 获取 ophub/kernel 的资产清单
        run: |
          echo "========== 获取 kernel_stable 中的资产 =========="
          curl -fsSL "https://api.github.com/repos/ophub/kernel/releases/tags/kernel_stable" \
            | jq -r '.assets[].name' > assets.txt
          
          echo "总资产数: $(wc -l < assets.txt)"
          echo "--- 6.6 系列相关资产（前 15 条） ---"
          grep -E "6\.6\." assets.txt | sort | head -15 || echo "(无 6.6 资产)"
          
          echo "--- ophub 中实际存在的 6.6 版本号 ---"
          grep -oE "6\.6\.[0-9]+" assets.txt | sort -uV || echo "(无)"

      - name: 克隆 OpenWrt 源码并探测版本
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.openwrt_version }} \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt

          echo "========== armsr target 的 KERNEL_PATCHVER =========="
          grep -E "KERNEL_PATCHVER" target/linux/armsr/Makefile || echo "(未找到)"

          echo "========== include/kernel-version.mk 前 20 行 =========="
          head -20 include/kernel-version.mk

          echo "========== 尝试提取 6.6 小版本 =========="
          # 尝试多种格式提取
          VER_RAW=$(grep -E "^LINUX_VERSION-6\.6" include/kernel-version.mk | head -1 | sed 's/.*= *//' | tr -d ' \r')
          
          if [ -n "$VER_RAW" ]; then
            OWRT_KREL="6.6${VER_RAW}"
            echo "✅ 成功提取: ${OWRT_KREL}"
          else
            echo "⚠️ 未匹配到 LINUX_VERSION-6.6 格式，使用兜底版本 6.6.93"
            OWRT_KREL="6.6.93"
          fi
          
          echo "OWRT_KREL=${OWRT_KREL}" >> $GITHUB_ENV
          echo "::notice::OpenWrt 侧预期内核版本: ${OWRT_KREL}"

      - name: 对比并判断匹配结果
        run: |
          OWRT_KREL="${{ env.OWRT_KREL }}"
          echo "======================================================"
          echo "OpenWrt 侧预期内核版本: ${OWRT_KREL}"
          echo "======================================================"

          if grep -q "$OWRT_KREL" assets.txt; then
            echo "::notice::✅ 匹配成功！ophub/kernel kernel_stable 里存在 ${OWRT_KREL}"
            echo "匹配到的具体资产:"
            grep "$OWRT_KREL" assets.txt
            echo ""
            echo "===== 结论 ====="
            echo "你可以放心使用 auto_kernel=false + ${OWRT_KREL} 进行严格锁定。"
          else
            echo "::error::❌ 匹配失败！ophub/kernel kernel_stable 里不存在 ${OWRT_KREL}"
            echo ""
            echo "ophub 里可用的 6.6 版本:"
            grep -oE "6\.6\.[0-9]+" assets.txt | sort -uV
            echo ""
            echo "===== 结论 ====="
            echo "因为 ophub 没有这个精确版本，严格锁定会失败。"
            echo "你必须改用 auto_kernel=true + openwrt_kernel: '6.6.y'"
            echo "或者自己编内核并发布到自己的仓库。"
            exit 1
          fi
