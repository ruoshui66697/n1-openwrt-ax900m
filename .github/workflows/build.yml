name: N1 OpenWrt AX900M 固件编译

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本分支'
        required: true
        default: 'v24.10.2'
      driver_branch:
        description: 'AX900M 驱动分支 (一般用 main; 若 dmesg 报 chip_mcu_id=1 选 legacy-mcu1)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - legacy-mcu1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu bc libelf-dev kmod

      - name: 查询 flippy 内核精确版本
        run: |
          KV=$(curl -fsSL "https://github.com/ophub/kernel/releases/expanded_assets/kernel_stable" \
               | grep -oP '6\.12\.\K[0-9]+(?=\.tar\.gz)' | sort -un | tail -1 || true)
          test -n "$KV" || { echo "查询 flippy 内核版本失败"; exit 1; }
          echo "KV=6.12.${KV}" >> $GITHUB_ENV
          echo ">>> flippy 内核: 6.12.${KV}"

      - name: 准备 flippy 内核构建树
        run: |
          sudo apt-get install -y zstd lz4
          git clone --depth 1 https://github.com/unifreq/linux-6.12.y.git ksrc
          cd ksrc
          KV="${{ env.KV }}"
          for c in $(git rev-list -n 5 HEAD); do
            V=$(git show "$c:Makefile" 2>/dev/null | awk -F'= ' '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/{printf "%s.", $2}' | sed 's/\.$//')
            if [ "$V" = "$KV" ]; then
              [ "$c" != "$(git rev-parse HEAD)" ] && git checkout -q "$c"
              break
            fi
          done
          echo ">>> 源码版本: $(awk -F'= ' '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/{printf "%s.", $2}' Makefile | sed 's/\.$//') (目标 $KV)"
          curl -fsSL "https://github.com/ophub/kernel/releases/download/kernel_stable/${KV}.tar.gz" -o /tmp/k.tar.gz
          tar xzf /tmp/k.tar.gz -C /tmp
          BOOT_TGZ=$(find /tmp -maxdepth 2 -name 'boot-*.tar.gz' 2>/dev/null | head -1 || true)
          test -n "$BOOT_TGZ" || { echo "内核包结构异常,把日志发我"; exit 1; }
          mkdir -p /tmp/boot && tar xzf "${BOOT_TGZ}" -C /tmp/boot 2>/dev/null || true
          echo ">>> boot 包内容:"
          find /tmp/boot -type f || true
          zimg=$(find /tmp/boot -type f \( -name 'zImage*' -o -name 'vmlinuz*' -o -name 'Image*' -o -name 'vmlinux*' -o -name 'uImage*' \) 2>/dev/null | head -1 || true)
          test -n "$zimg" || { echo "boot 包里没有内核镜像,把日志发我"; exit 1; }
          echo ">>> 内核镜像: $zimg ($(stat -c%s "$zimg") 字节)"
          echo ">>> 镜像前 64 字节:"
          od -A x -t x1z "$zimg" 2>/dev/null | head -4 || true
          rm -f /tmp/vmlinux
          extract_vmlinux() {
            local f="$1" off o m cmd pair
            if head -c 4 "$f" 2>/dev/null | grep -q $'\x7fELF'; then
              cat "$f" > /tmp/vmlinux; return 0
            fi
            if head -c 4 "$f" 2>/dev/null | grep -q "$(printf '\x27\x05\x19\x56')"; then
              echo ">>> 检测到 uImage 头,跳过 64 字节"
              dd if="$f" of=/tmp/inner.$$ ibs=1 skip=64 2>/dev/null || true
              if extract_vmlinux /tmp/inner.$$; then rm -f /tmp/inner.$$; return 0; fi
              rm -f /tmp/inner.$$
            fi
            off=$(LC_ALL=C grep -abo $'\x7fELF' "$f" 2>/dev/null | awk -F: '$1 < 2097152 {print $1; exit}' || true)
            if [ -n "$off" ]; then
              dd if="$f" bs=1 skip="$off" 2>/dev/null | cat > /tmp/vmlinux 2>/dev/null || true
              if head -c 4 /tmp/vmlinux 2>/dev/null | grep -q $'\x7fELF'; then return 0; fi
            fi
            for pair in "$(printf '\x1f\x8b\x08')|zcat" \
                        "$(printf '\x28\xb5\x2f\xfd')|zstd -dc" \
                        "$(printf '\x02\x21\x4c\x18')|lz4 -dc" \
                        "$(printf '\x42\x5a\x68')|bzip2 -dc"; do
              m="${pair%%|*}"; cmd="${pair##*|}"
              for o in $(LC_ALL=C grep -abo "$m" "$f" 2>/dev/null | head -3 | cut -d: -f1 || true); do
                dd if="$f" bs=1 skip="$o" 2>/dev/null | $cmd > /tmp/vmlinux 2>/dev/null || true
                if head -c 4 /tmp/vmlinux 2>/dev/null | grep -q $'\x7fELF'; then return 0; fi
              done
            done
            return 1
          }
          VMSZ=0
          if extract_vmlinux "$zimg"; then
            VMSZ=$(stat -c%s /tmp/vmlinux 2>/dev/null || echo 0)
          fi
          if [ "$VMSZ" -gt 10000000 ] && head -c 4 /tmp/vmlinux 2>/dev/null | grep -q $'\x7fELF'; then
            echo ">>> vmlinux 提取成功 (${VMSZ} 字节)"
            scripts/extract-ikconfig /tmp/vmlinux > /tmp/ikconfig 2>/dev/null || true
          else
            rm -f /tmp/vmlinux
            echo ">>> 未能解包内核镜像(降级处理,把上面'镜像前64字节'发我)"
          fi
          if [ -s /tmp/ikconfig ] && [ "$(wc -l < /tmp/ikconfig)" -gt 1000 ]; then
            cp /tmp/ikconfig .config
            echo ">>> 配置来源: IKCONFIG ($(wc -l < .config) 行)"
          else
            tar tzf "${BOOT_TGZ}" > /tmp/bootlist 2>/dev/null || true
            CFG=$(grep -m1 -i 'config' /tmp/bootlist 2>/dev/null || true)
            tar xzf "${BOOT_TGZ}" -O "$CFG" > .config 2>/dev/null || true
            echo ">>> 配置来源: boot 包 ($(wc -l < .config 2>/dev/null || echo 0) 行)"
          fi
          test "$(wc -l < .config)" -gt 1000 || { echo ".config 无效,把日志发我"; exit 1; }
          echo ">>> 关键结构选项:"
          grep -E 'CONFIG_MODULE_UNLOAD|CONFIG_MODULE_SIG=|CONFIG_LIVEPATCH|CONFIG_TRACING=|CONFIG_KALLSYMS=' .config || true
          SYM_OK=""
          if [ -s /tmp/vmlinux ]; then
            aarch64-linux-gnu-nm /tmp/vmlinux 2>/dev/null | awk '$3 ~ /^__ksymtab_/ {
                s=$3; sub(/^__ksymtab_/,"",s);
                sub(/^gpl_unused_/,"",s); sub(/^gpl_future_/,"",s);
                sub(/^unused_/,"",s); sub(/^gpl_/,"",s);
                if (s != "strings" && s != "") print "0x00000000\t" s "\tvmlinux"
            }' | sort -u > Module.symvers || true
            SYMN=$(wc -l < Module.symvers 2>/dev/null || echo 0)
            if [ "$SYMN" -ge 500 ]; then
              SYM_OK=1
              echo ">>> 内核导出符号数: $SYMN"
            else
              echo ">>> 符号数过少(${SYMN}),弃用"
              rm -f Module.symvers || true
            fi
          fi
          if [ -z "$SYM_OK" ]; then
            echo ">>> 驱动编译将使用 KBUILD_MODPOST_WARN"
            echo "KMOD_WARN=1" >> $GITHUB_ENV
          fi
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)
          echo "${KV}" > include/config/kernel.release
          sed -i "s/UTS_RELEASE \".*\"/UTS_RELEASE \"${KV}\"/" include/generated/utsrelease.h
          echo ">>> 内核构建树: $(cat include/config/kernel.release)"

      - name: 编译 AX900M 驱动(against flippy 内核)
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.driver_branch }} \
            https://github.com/shenmintao/aic8800d80.git aicsrc
          echo ">>> 驱动固件:"
          ls aicsrc/fw/ || true
          if [ "${{ env.KMOD_WARN }}" = "1" ]; then
            make -C ksrc ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              M=$PWD/aicsrc/drivers/aic8800 KBUILD_MODPOST_WARN=1 modules
          else
            make -C ksrc ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              M=$PWD/aicsrc/drivers/aic8800 modules
          fi
          find aicsrc -name '*.ko' | sort || true
          echo ">>> vermagic 校验(必须等于 ${{ env.KV }}):"
          find aicsrc -name '*.ko' -exec modinfo {} \; 2>/dev/null | grep vermagic || true

      - name: 组装驱动注入包
        run: |
          mkdir -p inject/opt/aic8800 inject/lib/firmware \
                   inject/etc/usb_modeswitch.d inject/etc/custom_service \
                   inject/etc/hotplug.d/usb inject/etc/profile.d
          find aicsrc -name '*.ko' -exec cp {} inject/opt/aic8800/ \; || true
          cp -r aicsrc/fw/. inject/lib/firmware/ 2>/dev/null || true
          cp -r aicsrc/fw/. inject/opt/aic8800/fw/ 2>/dev/null || true
          find aicsrc -path '*modeswitch*' -type f ! -name '*.md' \
            -exec cp {} "inject/etc/usb_modeswitch.d/1111:1111" \; 2>/dev/null || true
          cat > inject/etc/hotplug.d/usb/99-aic8800 <<'EOF'
          #!/bin/sh
          [ "$ACTION" = "add" ] || exit 0
          case "$PRODUCT" in
              a69c:8d80*|a69c:8d83*)
                  insmod /opt/aic8800/aic_load_fw.ko 2>/dev/null ;;
              a69c:8d81*|368b:8d81*)
                  modprobe cfg80211 2>/dev/null
                  insmod /opt/aic8800/aic8800_fdrv.ko 2>/dev/null
                  insmod /opt/aic8800/aic_zlp_quirk.ko 2>/dev/null
                  modprobe btusb 2>/dev/null ;;
          esac
          exit 0
          EOF
          chmod +x inject/etc/hotplug.d/usb/99-aic8800
          cat > inject/etc/custom_service/start_service.sh <<'EOF'
          #!/bin/sh
          i=0
          while [ $i -lt 40 ]; do
              lsusb | grep -qiE 'a69c|368b' && break
              if lsusb | grep -q "1111:1111"; then
                  usb_modeswitch -v 0x1111 -p 0x1111 \
                    -M 555342438765432100000000000010fd0000000000000000000000000000f3 \
                    -M 555342438765432100000000000010fd0000000000000000000000000000f2 >/dev/null 2>&1
              fi
              sleep 3; i=$((i+3))
          done
          sleep 2
          [ -d /lib/firmware/aic8800D80 ] || cp -r /opt/aic8800/fw/. /lib/firmware/ 2>/dev/null
          modprobe cfg80211 2>/dev/null
          insmod /opt/aic8800/aic_load_fw.ko 2>/dev/null
          sleep 3
          insmod /opt/aic8800/aic8800_fdrv.ko 2>/dev/null
          insmod /opt/aic8800/aic_zlp_quirk.ko 2>/dev/null
          modprobe btusb 2>/dev/null
          exit 0
          EOF
          chmod +x inject/etc/custom_service/start_service.sh
          printf '#!/bin/sh\n# 覆盖原脚本的 ash 语法报错\nexit 0\n' > inject/etc/profile.d/30-sysinfo.sh
          chmod +x inject/etc/profile.d/30-sysinfo.sh
          echo ">>> 注入包:"
          find inject -type f | sort || true

      - name: 上传驱动模块包(免刷机热修用)
        uses: actions/upload-artifact@v4
        with:
          name: ax900m-modules
          path: |
            inject/opt/aic8800/
            inject/opt/bin/
          if-no-files-found: error

      - name: 准备中文语言包与切换工具(离线注入)
        run: |
          sudo apt-get install -y libarchive-tools
          mkdir -p inject/opt/ipks inject/opt/bin inject/etc/uci-defaults
          REL="${{ github.event.inputs.openwrt_version }}"
          REL="${REL#v}"
          REPO="https://downloads.openwrt.org/releases/${REL}/packages/aarch64_generic"
          download_ipk() {
            local sub="$1" pkg="$2" file
            file=$(curl -fsSL "${REPO}/${sub}/Packages.gz" | gunzip \
                   | awk -v p="${pkg}_" '$1=="Filename:" && $2 ~ p {print $2; exit}' || true)
            case "$file" in
              */*) ;;
              *) file="${sub}/${file}" ;;
            esac
            if [ -n "$file" ]; then
              curl -fsSL "${REPO}/${file}" -o "inject/opt/ipks/${pkg}.ipk" \
                && echo ">>> 已下载 ${pkg}" || echo ">>> 下载失败 ${pkg}"
            else
              echo ">>> 仓库里没找到 ${pkg}"
            fi
          }
          download_ipk luci luci-i18n-base-zh-cn
          download_ipk luci luci-i18n-firewall-zh-cn
          download_ipk luci luci-i18n-mwan3-zh-cn
          download_ipk packages usb-modeswitch
          ls -la inject/opt/ipks/ || true
          if [ -s inject/opt/ipks/usb-modeswitch.ipk ]; then
            rm -rf /tmp/msw && mkdir -p /tmp/msw/outer /tmp/msw/data
            IPK="$PWD/inject/opt/ipks/usb-modeswitch.ipk"
            echo ">>> ipk 文件类型诊断:"
            file "$IPK" || true
            od -A x -t x1z "$IPK" 2>/dev/null | head -2 || true
            bsdtar xf "$IPK" -C /tmp/msw/outer 2>/dev/null \
              || tar xf "$IPK" -C /tmp/msw/outer 2>/dev/null \
              || zstd -dc "$IPK" 2>/dev/null | tar x -C /tmp/msw/outer 2>/dev/null \
              || zcat "$IPK" 2>/dev/null | tar x -C /tmp/msw/outer 2>/dev/null \
              || xz -dc "$IPK" 2>/dev/null | tar x -C /tmp/msw/outer 2>/dev/null \
              || (cd /tmp/msw/outer && ar x "$IPK" 2>/dev/null) \
              || true
            DATA=$(find /tmp/msw/outer -maxdepth 1 -name 'data.tar.*' | head -1 || true)
            if [ -n "$DATA" ]; then
              bsdtar xf "$DATA" -C /tmp/msw/data 2>/dev/null \
                || tar xf "$DATA" -C /tmp/msw/data 2>/dev/null \
                || zstd -dc "$DATA" 2>/dev/null | tar x -C /tmp/msw/data 2>/dev/null \
                || zcat "$DATA" 2>/dev/null | tar x -C /tmp/msw/data 2>/dev/null \
                || true
            fi
            BIN=$(find /tmp/msw/data -type f -name 'usb_modeswitch' | head -1 || true)
            if [ -n "$BIN" ]; then
              cp "$BIN" inject/opt/bin/usb_modeswitch
              chmod +x inject/opt/bin/usb_modeswitch
              echo ">>> usb_modeswitch 二进制已提取"
            else
              echo ">>> 未能从 ipk 提取 usb_modeswitch(把'文件类型诊断'输出发我)"
            fi
          fi
          cat > inject/etc/uci-defaults/99-zh-cn <<'EOF'
          #!/bin/sh
          opkg install /opt/ipks/luci-i18n-*.ipk 2>/dev/null
          opkg install --force-reinstall /opt/ipks/luci-i18n-*.ipk 2>/dev/null
          for d in /usr/sbin /usr/bin /sbin /bin; do
              cp /opt/bin/usb_modeswitch "$d/" 2>/dev/null
          done
          uci set luci.main.lang='zh_cn' 2>/dev/null && uci commit luci 2>/dev/null
          exit 0
          EOF
          chmod +x inject/etc/uci-defaults/99-zh-cn

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.openwrt_version }} \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置(无需仓库内 config 文件)
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_bluez-daemon=y
          CONFIG_PACKAGE_bluez-utils=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y
          EOF
          sed -i 's/^          //' .config
          make defconfig

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译 OpenWrt rootfs
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          ls -lh bin/targets/armsr/armv8/*rootfs.tar.gz
          echo ">>> rootfs 内容检查:"
          tar tzf bin/targets/armsr/armv8/*rootfs.tar.gz | grep -E 'usb_modeswitch|zh-cn|mwan3' | sort || true

      - name: 升级 coreutils(ophub 脚本需要新版 cp 语法)
        run: |
          curl -fsSL https://ftp.gnu.org/gnu/coreutils/coreutils-9.9.tar.xz | tar xJ
          cd coreutils-9.9
          ./configure --quiet >/dev/null
          make -j$(nproc) >/dev/null
          sudo make install >/dev/null
          hash -r
          cp --version | head -1
          cp --update=none --version >/dev/null && echo ">>> cp --update=none 已支持" || true

      - name: 打包 N1 固件(ophub)
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/*/*/*rootfs.tar.gz
          openwrt_board: s905d
          openwrt_kernel: ${{ env.KV }}
          auto_kernel: false
          openwrt_files: inject

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-AX900M
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          if-no-files-found: error
