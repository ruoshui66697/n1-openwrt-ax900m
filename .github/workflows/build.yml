name: N1 OpenWrt AX900M 固件编译 (自编译内核版)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本'
        required: true
        default: 'v24.10.2'
        type: string
      kernel_version:
        description: 'Linux 内核版本 (stable 点发布, 如 5.15.225)'
        required: true
        default: '5.15.225'
        type: string
      driver_branch:
        description: 'AIC8800 驱动分支'
        required: true
        default: 'legacy-mcu1'
        type: choice
        options:
          - main
          - legacy-mcu1

env:
  AIC_REPO_URL: https://github.com/shenmintao/aic8800d80.git
  KERNEL_RELEASE_TAG: kernel_stable
  KERNEL_MIRROR: https://github.com/gregkh/linux.git

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # ============================================================
      # Phase 0: 磁盘清理 + 工具链
      # ============================================================
      - name: 释放磁盘空间 + 启用 swap
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghc /usr/share/swift /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: 安装编译依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget bc libelf-dev kmod bzip2 zstd \
            lz4 u-boot-tools cpio dosfstools libtool pkg-config autoconf \
            automake jq device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # ============================================================
      # Phase 1: 自编译 Amlogic 内核
      # ============================================================
      - name: 克隆 Linux 内核源码 (GitHub 镜像 + 重试)
        run: |
          set -euo pipefail
          KVER="${{ github.event.inputs.kernel_version }}"
          echo "KVER=${KVER}" >> $GITHUB_ENV
          KTAG="v${KVER}"

          clone_kernel() {
            rm -rf /tmp/linux
            git clone --depth 1 --branch "${KTAG}" \
              "${KERNEL_MIRROR}" /tmp/linux
          }

          MAX_RETRY=3
          for i in $(seq 1 $MAX_RETRY); do
            echo "尝试克隆 ${KTAG} (${i}/${MAX_RETRY})..."
            if clone_kernel; then
              echo "✅ 内核源码克隆成功"
              exit 0
            fi
            if [ "$i" -eq "$MAX_RETRY" ]; then
              echo "❌ 克隆失败，已达最大重试次数"
              exit 1
            fi
            echo "克隆失败，清理后 5 秒重试..."
            rm -rf /tmp/linux
            sleep 5
          done

      - name: 配置内核
        run: |
          set -euo pipefail
          cd /tmp/linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config \
            --module CFG80211 \
            --module MAC80211 \
            --module BT \
            --module BT_BCM \
            --module BT_HCIBTUSB \
            --module USB_NET_AX8817X \
            --module USB_NET_RNDIS_HOST \
            --module USB_SERIAL \
            --enable USB_STORAGE \
            --enable BLK_DEV_INITRD \
            --enable DEVTMPFS_MOUNT \
            --enable MODULES \
            --set-str LOCALVERSION "-self"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: 编译内核 Image + DTB + 模块
        run: |
          set -euo pipefail
          cd /tmp/linux
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image modules dtbs
          test -f arch/arm64/boot/Image
          test -f arch/arm64/boot/dts/amlogic/meson-gxl-s905d-phicomm-n1.dtb
          echo "✅ 内核编译完成"

      # ============================================================
      # Phase 2: 编译 AIC8800 WiFi 驱动
      # ============================================================
      - name: 编译 AIC8800 驱动模块
        id: build_aic8800
        run: |
          set -euo pipefail
          echo "skip=false" >> $GITHUB_OUTPUT
          git clone --depth 1 --branch "${{ github.event.inputs.driver_branch }}" \
            "${AIC_REPO_URL}" /tmp/aic8800
          DRIVER_DIR="/tmp/aic8800/drivers/aic8800"
          if [ ! -f "$DRIVER_DIR/Makefile" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          find "$DRIVER_DIR" -name "*.c" -exec \
            sed -i 's/AICWFDBG(LOGERROR).*chip unsupport.*/\/\/ Bypassed/g' {} \; || true
          cd "$DRIVER_DIR"
          if ! make -j$(nproc) \
            KDIR="/tmp/linux" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_PLATFORM_UBUNTU=y CONFIG_PLATFORM_AMLOGIC=n \
            CONFIG_PLATFORM_ROCKCHIP=n CONFIG_PLATFORM_ALLWINNER=n CONFIG_PLATFORM_HI=n \
            2>&1 | tee /tmp/aic8800_build.log; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          mkdir -p /tmp/aic8800_modules
          find "$DRIVER_DIR" -name "*.ko" -exec cp {} /tmp/aic8800_modules/ \;
          if [ -z "$(ls /tmp/aic8800_modules/*.ko 2>/dev/null || true)" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "✅ AIC8800 编译成功"

      # ============================================================
      # Phase 3: 构建 OpenWrt rootfs
      # ============================================================
      - name: 克隆 OpenWrt 源码
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.inputs.openwrt_version }}" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 rootfs 配置
        run: |
          set -euo pipefail
          cd openwrt
          {
            echo "CONFIG_TARGET_armsr=y"
            echo "CONFIG_TARGET_armsr_armv8=y"
            echo "CONFIG_TARGET_ROOTFS_TARGZ=y"
            echo "CONFIG_PACKAGE_luci=y"
            echo "CONFIG_PACKAGE_luci-lib-i18n=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-app-mwan3=y"
            echo "CONFIG_PACKAGE_uhttpd=y"
            echo "CONFIG_PACKAGE_uhttpd-mod-ubus=y"
            echo "CONFIG_PACKAGE_rpcd=y"
            echo "CONFIG_PACKAGE_rpcd-mod-file=y"
            echo "CONFIG_PACKAGE_wpad-mbedtls=y"
            echo "CONFIG_PACKAGE_iw=y"
            echo "CONFIG_PACKAGE_iwinfo=y"
            echo "CONFIG_PACKAGE_bluez-daemon=y"
            echo "CONFIG_PACKAGE_bluez-utils=y"
            echo "CONFIG_PACKAGE_usbutils=y"
            echo "CONFIG_PACKAGE_libusb-1.0=y"
            echo "CONFIG_PACKAGE_mwan3=y"
          } > .config
          make defconfig

      - name: 下载依赖
        run: |
          set -euo pipefail
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译 OpenWrt rootfs
        run: |
          set -euo pipefail
          cd openwrt
          if ! make -j$(nproc) 2>&1 | tee /tmp/openwrt_build.log; then
            make -j1 V=s 2>&1 | tee -a /tmp/openwrt_build.log
          fi

      - name: 验证 rootfs 产物
        run: |
          set -euo pipefail
          cd openwrt

          ROOTFS_PATH=$(find "$PWD/bin/targets/armsr" -name "*rootfs.tar.gz" | head -1)

          if [ -z "$ROOTFS_PATH" ] || [ ! -f "$ROOTFS_PATH" ]; then
            echo "❌ rootfs 文件未找到或路径无效"
            echo "查找路径: $PWD/bin/targets/armsr"
            find "$PWD/bin/targets/armsr" -type f -name "*rootfs*" || true
            exit 1
          fi

          echo "ROOTFS_PATH=${ROOTFS_PATH}" >> $GITHUB_ENV
          echo "✅ rootfs 路径: ${ROOTFS_PATH}"
          echo "文件大小: $(du -h "$ROOTFS_PATH" | cut -f1)"

      # ============================================================
      # Phase 3.5: 组装注入包
      # ============================================================
      - name: 组装注入文件
        run: |
          set -euo pipefail
          INJECT="$GITHUB_WORKSPACE/inject"
          rm -rf "$INJECT"
          mkdir -p "$INJECT"/etc/hotplug.d/usb "$INJECT"/etc/uci-defaults "$INJECT"/lib/firmware

          if [ -d /tmp/aic8800/fw ]; then
            cp -r /tmp/aic8800/fw/. "$INJECT/lib/firmware/"
          fi

          SKIP="${{ steps.build_aic8800.outputs.skip }}"
          if [ "$SKIP" != "true" ]; then
            cat > "$INJECT/etc/hotplug.d/usb/99-aic8800" <<'EOF'
          #!/bin/sh
          [ "$ACTION" = "add" ] || exit 0
          case "$PRODUCT" in
            a69c/8d80/*|a69c/8d81/*|368b/8d81/*)
              modprobe aic_load_fw 2>/dev/null || true
              sleep 1
              modprobe aic8800_fdrv 2>/dev/null || true
              ;;
          esac
          exit 0
          EOF
            chmod +x "$INJECT/etc/hotplug.d/usb/99-aic8800"
          fi

          cat > "$INJECT/etc/uci-defaults/99-set-lan-ip" <<'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr="192.168.10.1"
          uci commit network
          exit 0
          EOF
          chmod +x "$INJECT/etc/uci-defaults/99-set-lan-ip"

          cat > "$INJECT/etc/uci-defaults/99-zh-cn" <<'EOF'
          #!/bin/sh
          uci set luci.main.lang="zh_cn"
          uci commit luci
          exit 0
          EOF
          chmod +x "$INJECT/etc/uci-defaults/99-zh-cn"

      - name: 把注入文件合并到 rootfs tar.gz
        run: |
          set -euo pipefail
          ROOTFS="${ROOTFS_PATH}"

          if [ ! -f "$ROOTFS" ]; then
            echo "❌ 注入步骤：ROOTFS 文件不存在: $ROOTFS"
            exit 1
          fi

          INJECT="$GITHUB_WORKSPACE/inject"
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          tar xzf "$ROOTFS" -C "$TMPDIR"
          cp -a "$INJECT"/. "$TMPDIR"/
          tar czf "$ROOTFS" --owner=0 --group=0 -C "$TMPDIR" .
          echo "✅ 注入文件已合并到 rootfs"

      # ============================================================
      # Phase 4: 打包内核为 ophub 目录树格式 (兼容 remake)
      # ============================================================
      - name: 打包内核为 ophub 格式
        run: |
          set -euo pipefail
          KVER="${{ env.KVER }}"
          KNAME="${KVER}-self"
          echo "KNAME=${KNAME}" >> $GITHUB_ENV

          PKG=/tmp/kernel_pkg
          rm -rf "$PKG"
          
          # 按照 remake 脚本期望的路径建目录
          mkdir -p "$PKG/$KNAME/s905d/boot"
          mkdir -p "$PKG/$KNAME/s905d/dtb"
          mkdir -p "$PKG/$KNAME/s905d/rootfs/lib/modules"
          mkdir -p "$PKG/$KNAME/s905d/rootfs/usr/lib/modules"

          # 1. 放入 boot 文件
          cp /tmp/linux/arch/arm64/boot/Image  "$PKG/$KNAME/s905d/boot/vmlinuz-${KNAME}"
          cp /tmp/linux/.config                "$PKG/$KNAME/s905d/boot/config-${KNAME}"
          cp /tmp/linux/System.map             "$PKG/$KNAME/s905d/boot/System.map-${KNAME}"
          
          echo | cpio -o -H newc 2>/dev/null | gzip -9 > /tmp/initrd.gz
          mkimage -A arm64 -O linux -T ramdisk -C gzip \
            -d /tmp/initrd.gz "$PKG/$KNAME/s905d/boot/uInitrd-${KNAME}"

          # 2. 放入 DTB 文件
          cp /tmp/linux/arch/arm64/boot/dts/amlogic/meson-gxl-*.dtb "$PKG/$KNAME/s905d/dtb/" 2>/dev/null || true
          cp /tmp/linux/arch/arm64/boot/dts/amlogic/meson-gxm-*.dtb "$PKG/$KNAME/s905d/dtb/" 2>/dev/null || true
          
          test -f "$PKG/$KNAME/s905d/dtb/meson-gxl-s905d-phicomm-n1.dtb" || {
            echo "❌ 缺少 N1 DTB"; exit 1
          }

          # 3. 安装模块到暂存区
          MOD_STAGING=/tmp/kernel_mods
          rm -rf "$MOD_STAGING"
          mkdir -p "$MOD_STAGING"
          cd /tmp/linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$MOD_STAGING" modules_install 2>&1 | tail -5

          # 删除干扰项
          rm -f "$MOD_STAGING/lib/modules/${KNAME}/build"
          rm -f "$MOD_STAGING/lib/modules/${KNAME}/source"

          # 加入 AIC8800
          SKIP="${{ steps.build_aic8800.outputs.skip }}"
          if [ "$SKIP" != "true" ] && [ -d /tmp/aic8800_modules ]; then
            MOD_DIR="$MOD_STAGING/lib/modules/${KNAME}"
            mkdir -p "$MOD_DIR/kernel/drivers/aic8800"
            cp /tmp/aic8800_modules/*.ko "$MOD_DIR/kernel/drivers/aic8800/"
          fi

          depmod -b "$MOD_STAGING" "${KNAME}"

          # 4. 移入目标目录，并生成双路径
          mv "$MOD_STAGING/lib/modules/${KNAME}" \
             "$PKG/$KNAME/s905d/rootfs/lib/modules/"
          
          # 用 cp -al 创建硬链接，避免占用双倍空间
          cp -al "$PKG/$KNAME/s905d/rootfs/lib/modules/${KNAME}" \
                 "$PKG/$KNAME/s905d/rootfs/usr/lib/modules/"

          # 5. 校验模块非空
          for MOD_DIR in \
            "$PKG/$KNAME/s905d/rootfs/lib/modules/${KNAME}" \
            "$PKG/$KNAME/s905d/rootfs/usr/lib/modules/${KNAME}"; do
            KO_COUNT=$(find "$MOD_DIR" -name "*.ko" | wc -l)
            echo "${MOD_DIR}: ${KO_COUNT} .ko"
            [ "${KO_COUNT}" -gt 0 ] || { echo "❌ 模块目录为空: ${MOD_DIR}"; exit 1; }
          done

          # 6. 直接打包成目录树 (不要包含任何子 tar)
          cd "$PKG"
          tar czf "/tmp/${KNAME}.tar.gz" --owner=0 --group=0 "${KNAME}"

          echo "✅ 内核树打包完成: /tmp/${KNAME}.tar.gz"
          echo "===== tar 内部目录结构验证 ====="
          tar -tzf "/tmp/${KNAME}.tar.gz" | grep -E "(boot/|dtb/|lib/modules/)" | head -n 10

      # ============================================================
      # Phase 5: 上传内核目录树到 Release
      # ============================================================
      - name: 上传内核到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KNAME="${{ env.KNAME }}"
          TAG="${{ env.KERNEL_RELEASE_TAG }}"
          REPO="${{ github.repository }}"
          ASSET="/tmp/${KNAME}.tar.gz"

          test -f "${ASSET}" || { echo "❌ 内核文件不存在: ${ASSET}"; exit 1; }

          for OLD_TAG in "kernel_stable" "stable"; do
            if gh release view "${OLD_TAG}" --repo "${REPO}" >/dev/null 2>&1; then
              gh release delete "${OLD_TAG}" --cleanup-tag --yes --repo "${REPO}" || true
            fi
          done

          gh release create "${TAG}" "${ASSET}" \
            --repo "${REPO}" \
            --title "Kernel ${KNAME}" \
            --notes "Self-compiled kernel ${KNAME} for Amlogic S905D (N1)"

          echo "✅ 内核已上传到 release ${TAG}"

          # 下载回来二次验证
          sleep 10
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          gh release download "${TAG}" --repo "${REPO}" \
            --pattern "${KNAME}.tar.gz" --dir /tmp/verify --clobber

          tar -tzf "/tmp/verify/${KNAME}.tar.gz" > /tmp/release_tarlist.txt 2>/dev/null
          grep -q "^${KNAME}/s905d/boot/vmlinuz-" /tmp/release_tarlist.txt || { echo "❌ 验证失败: 缺少 boot"; exit 1; }
          grep -q "^${KNAME}/s905d/rootfs/lib/modules/" /tmp/release_tarlist.txt || { echo "❌ 验证失败: 缺少 lib/modules"; exit 1; }
          grep -q "^${KNAME}/s905d/rootfs/usr/lib/modules/" /tmp/release_tarlist.txt || { echo "❌ 验证失败: 缺少 usr/lib/modules"; exit 1; }
          echo "✅ Release 资产验证通过"

      # ============================================================
      # Phase 5.5: 临时包装 cp
      # ============================================================
      - name: 包装 cp（绕过 --update 参数兼容性）
        run: |
          set -euo pipefail
          sudo cp -a /usr/bin/cp /usr/bin/cp.orig
          printf '#!/bin/bash\nargs=()\nfor arg in "$@"; do\n  if [[ "$arg" == "--update" ]]; then args+=("-n")\n  elif [[ "$arg" == --update=* ]]; then args+=("-n")\n  else args+=("$arg"); fi\ndone\nexec /usr/bin/cp.orig "${args[@]}"\n' | sudo tee /usr/bin/cp > /dev/null
          sudo chmod 755 /usr/bin/cp
          echo "===== 验证包装 cp ====="
          echo "test" > /tmp/_cp_src
          cp --update=older /tmp/_cp_src /tmp/_cp_dst && echo "✅ --update=older 可用"
          rm -f /tmp/_cp_src /tmp/_cp_dst

      # ============================================================
      # Phase 6: 打包固件
      # ============================================================
      - name: 打包 N1 固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ env.ROOTFS_PATH }}
          openwrt_board: s905d
          kernel_repo: ${{ github.repository }}
          kernel_usage: stable
          openwrt_kernel: ${{ env.KNAME }}
          auto_kernel: false
          openwrt_files: inject

      # ============================================================
      # Phase 7: 上传产物
      # ============================================================
      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-AX900M-${{ env.KVER }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          if-no-files-found: error

      # ============================================================
      # Phase 7.5: 恢复系统 cp
      # ============================================================
      - name: 恢复系统 cp
        if: always()
        run: |
          if [ -f /usr/bin/cp.orig ]; then
            sudo cp -a /usr/bin/cp.orig /usr/bin/cp
            sudo rm -f /usr/bin/cp.orig
            echo "✅ 已恢复系统 cp"
          else
            echo "⚠️ cp.orig 不存在，跳过恢复"
          fi

      - name: 推送结果到钉钉
        if: always()
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          KERNEL_VER: ${{ env.KVER }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          SKIP="${{ steps.build_aic8800.outputs.skip }}"
          if [ "$JOB_STATUS" = "success" ]; then
            if [ "$SKIP" = "true" ]; then
              TITLE="[N1 OpenWrt] 构建成功 (内核: $KERNEL_VER, WiFi 缺失)"
              CONTENT="AIC8800 WiFi 驱动未成功，固件无 WiFi 支持。"
            else
              TITLE="[N1 OpenWrt] 构建成功 (内核: $KERNEL_VER)"
              CONTENT="自编译内核，AIC8800 WiFi 已包含。"
            fi
          else
            TITLE="[N1 OpenWrt] 构建失败"
            CONTENT="查看日志: $RUN_URL"
          fi
          PAYLOAD=$(jq -n --arg t "$TITLE" --arg c "$CONTENT" --arg u "$RUN_URL" \
            '{msgtype:"text",text:{content:($t+"\n"+$c+"\n"+$u)}}')
          if [ -n "$DINGTALK_TOKEN" ]; then
            if [ -n "$DINGTALK_SECRET" ]; then
              TS=$(date +%s000)
              SIGN=$(echo -n "${TS}\n${DINGTALK_SECRET}" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64 | sed 's/+/%20/g;s/\//%2F/g;s/=/%3D/g')
              WH="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}&timestamp=${TS}&sign=${SIGN}"
            else
              WH="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}"
            fi
            curl -sS -X POST "$WH" -H "Content-Type: application/json" -d "$PAYLOAD" || true
          fi
