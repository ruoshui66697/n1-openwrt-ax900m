name: N1 OpenWrt AX900M 固件编译 (自编译内核版)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本'
        required: true
        default: 'v24.10.2'
        type: string
      kernel_version:
        description: 'Linux 内核版本 (如 5.15.178)'
        required: true
        default: '5.15.178'
        type: string
      driver_branch:
        description: 'AIC8800 驱动分支'
        required: true
        default: 'legacy-mcu1'
        type: choice
        options:
          - main
          - legacy-mcu1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # ============================================================
      # Phase 0: 安装工具链
      # ============================================================
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget bc libelf-dev kmod bzip2 zstd \
            lz4 u-boot-tools cpio dosfstools libtool pkg-config autoconf \
            automake jq device-tree-compiler gcc-aarch64-linux-gnu

      # ============================================================
      # Phase 1: 自编译 Amlogic 内核 (从 mainline Linux 源码)
      # ============================================================
      - name: 克隆 Linux 内核源码
        run: |
          KVER="${{ github.event.inputs.kernel_version }}"
          echo "KVER=${KVER}" >> $GITHUB_ENV
          KTAG="v${KVER}"

          echo "克隆 Linux ${KTAG} (depth=1)..."
          git clone --depth 1 --branch "${KTAG}" \
            https://github.com/torvalds/linux.git /tmp/linux

          cd /tmp/linux
          echo "内核源码就绪: $(git describe --tags)"

      - name: 配置内核 (meson_gxl_defconfig + WiFi/USB)
        run: |
          cd /tmp/linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- meson_gxl_defconfig

          scripts/config --enable CFG80211
          scripts/config --enable MAC80211
          scripts/config --enable USB_SUPPORT
          scripts/config --enable USB
          scripts/config --enable USB_ANNOUNCE_NEW_DEVICES
          scripts/config --enable USB_NET_AX8817X
          scripts/config --enable USB_NET_RNDIS_HOST
          scripts/config --enable USB_SERIAL
          scripts/config --enable USB_STORAGE
          scripts/config --module CFG80211
          scripts/config --module MAC80211
          scripts/config --module BT
          scripts/config --module BT_BCM
          scripts/config --module BT_HCIBTUSB
          scripts/config --enable MODULES
          scripts/config --enable KALLSYMS
          scripts/config --enable PROC_FS
          scripts/config --enable SYSFS
          scripts/config --enable DEVTMPFS
          scripts/config --enable DEVTMPFS_MOUNT

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "内核配置完成"
          grep -E "CFG80211|MAC80211|USB_SUPPORT|USB_NET" .config | head -10

      - name: 编译内核 Image + DTB + 模块
        run: |
          cd /tmp/linux
          echo "编译内核 (约 20-40 分钟)..."
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            Image modules dtbs 2>&1 | tail -20

          echo "内核编译完成"
          ls -lh arch/arm64/boot/Image
          echo "DTB 文件:"
          ls arch/arm64/boot/dts/amlogic/meson-gxl-s905d-*.dtb 2>/dev/null || true
