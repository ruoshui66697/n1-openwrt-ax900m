name: N1 OpenWrt AX900M 固件编译 (自编译内核版)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本'
        required: true
        default: 'v24.10.2'
        type: string
      kernel_version:
        description: 'Linux 内核版本 (stable 点发布, 如 5.15.225)'
        required: true
        default: '5.15.225'
        type: string
      driver_branch:
        description: 'AIC8800 驱动分支'
        required: true
        default: 'legacy-mcu1'
        type: choice
        options:
          - main
          - legacy-mcu1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # ============================================================
      # Phase 0: 安装工具链
      # ============================================================
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget bc libelf-dev kmod bzip2 zstd \
            lz4 u-boot-tools cpio dosfstools libtool pkg-config autoconf \
            automake jq device-tree-compiler gcc-aarch64-linux-gnu

      # ============================================================
      # Phase 1: 自编译 Amlogic 内核 (从 mainline Linux 源码)
      # ============================================================
      - name: 克隆 Linux 内核源码
        run: |
          KVER="${{ github.event.inputs.kernel_version }}"
          echo "KVER=${KVER}" >> $GITHUB_ENV
          KTAG="v${KVER}"

          echo "克隆 Linux ${KTAG} (depth=1)..."
          git clone --depth 1 --branch "${KTAG}" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git /tmp/linux

          cd /tmp/linux
          echo "内核源码就绪: $(git describe --tags)"

      - name: 配置内核 (arm64 defconfig + Amlogic Meson + WiFi/USB)
        run: |
          cd /tmp/linux
          # 使用通用 arm64 defconfig (meson_gxl_defconfig 在 stable 仓库中不存在)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

          # --- Amlogic Meson 平台支持 ---
          scripts/config --enable ARCH_MESON
          scripts/config --enable MESON_GX_SOCINFO
          scripts/config --enable MESON_GX_PM_DOMAINS
          scripts/config --enable MESON_EE_PM_DOMAINS
          scripts/config --enable COMMON_CLK_GXBB
          scripts/config --enable COMMON_CLK_AXG
          scripts/config --enable COMMON_CLK_G12A
          scripts/config --enable COMMON_CLK_SM1
          scripts/config --enable MESON_GX_MMC
          scripts/config --enable MESON_MX_SDIO
          scripts/config --enable SERIAL_MESON
          scripts/config --enable SERIAL_MESON_CONSOLE
          scripts/config --enable MESON8B_WATCHDOG
          scripts/config --enable MESON_SARADC
          scripts/config --enable MESON_SM
          scripts/config --enable MESON_MX_SOCINFO
          scripts/config --enable PHY_MESON8B_USB2
          scripts/config --enable PHY_MESON_GXL_USB2
          scripts/config --enable PHY_MESON_G12A_USB2
          scripts/config --enable PHY_MESON_G12A_USB3_PCIE
          scripts/config --enable PHY_MESON_AXG_PCIE
          scripts/config --enable DWMAC_MESON
          scripts/config --enable STMMAC_ETH
          scripts/config --enable STMMAC_PLATFORM
          scripts/config --enable MESON_CAN
          scripts/config --enable DRM_MESON
          scripts/config --enable DRM_MESON_DW_HDMI
          scripts/config --enable DRM_MESON_DW_MIPI_DSI
          scripts/config --enable DRM_MESON_VPU
          scripts/config --enable SND_SOC_MESON
          scripts/config --enable SND_SOC_GX_SOUND_CARD

          # --- WiFi 子系统 ---
          scripts/config --enable CFG80211
          scripts/config --enable MAC80211
          scripts/config --module CFG80211
          scripts/config --module MAC80211
          scripts/config --module BT
          scripts/config --module BT_BCM
          scripts/config --module BT_HCIBTUSB

          # --- USB 子系统 ---
          scripts/config --enable USB_SUPPORT
          scripts/config --enable USB
          scripts/config --enable USB_ANNOUNCE_NEW_DEVICES
          scripts/config --enable USB_NET_AX8817X
          scripts/config --enable USB_NET_RNDIS_HOST
          scripts/config --enable USB_SERIAL
          scripts/config --enable USB_STORAGE
          scripts/config --enable USB_XHCI_HCD
          scripts/config --enable USB_EHCI_HCD
          scripts/config --enable USB_OHCI_HCD

          # --- 基础内核功能 ---
          scripts/config --enable MODULES
          scripts/config --enable KALLSYMS
          scripts/config --enable PROC_FS
          scripts/config --enable SYSFS
          scripts/config --enable DEVTMPFS
          scripts/config --enable DEVTMPFS_MOUNT
          scripts/config --enable INITRAMFS_SOURCE
          scripts/config --enable BLK_DEV_INITRD
          scripts/config --enable OF
          scripts/config --enable I2C
          scripts/config --enable SPI
          scripts/config --enable GPIO_SYSFS
          scripts/config --enable PINCTRL
          scripts/config --enable PWM
          scripts/config --enable REGULATOR
          scripts/config --enable THERMAL

          # 设置内核本地版本后缀，让模块目录名与 KNAME 匹配
          scripts/config --set-str LOCALVERSION "-self"

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "内核配置完成"
          grep -E "ARCH_MESON|CFG80211|MAC80211|USB_SUPPORT|LOCALVERSION" .config | head -10

      - name: 编译内核 Image + DTB + 模块
        run: |
          cd /tmp/linux
          echo "编译内核 (约 20-40 分钟)..."
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            Image modules dtbs 2>&1 | tail -20

          echo "内核编译完成"
          ls -lh arch/arm64/boot/Image
          echo "DTB 文件:"
          ls arch/arm64/boot/dts/amlogic/meson-gxl-s905d-*.dtb 2>/dev/null || true

      - name: 准备内核头文件 (生成 x86 宿主工具)
        run: |
          cd /tmp/linux
          echo "运行 modules_prepare..."
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare 2>&1 | tail -5

          echo "生成 Module.symvers..."
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            modules 2>&1 | tail -5 || true

          file scripts/basic/fixdep
          echo "内核头文件准备完成"

      # ============================================================
      # Phase 2: 编译 AIC8800 WiFi 驱动模块
      # ============================================================
      - name: 编译 AIC8800 驱动模块
        id: build_aic8800
        run: |
          KVER="${{ env.KVER }}"

          echo "克隆 AIC8800 驱动源码..."
          git clone --depth 1 --branch ${{ github.event.inputs.driver_branch }} \
            https://github.com/shenmintao/aic8800d80.git /tmp/aic8800

          DRIVER_DIR="/tmp/aic8800/drivers/aic8800"
          if [ ! -f "$DRIVER_DIR/Makefile" ]; then
            echo "未找到内核模块 Makefile"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          find "$DRIVER_DIR" -name "*.c" -exec \
            sed -i 's/AICWFDBG(LOGERROR).*chip unsupport.*/\/\/ Bypassed/g' {} \;
          find "$DRIVER_DIR" -name "*.c" -exec \
            sed -i 's/return -1; \/\/ Unsupported chip/return 0;/g' {} \;

          cd "$DRIVER_DIR"

          echo "编译 AIC8800 内核模块..."
          if ! make modules \
            KDIR="/tmp/linux" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_PLATFORM_UBUNTU=y \
            CONFIG_PLATFORM_AMLOGIC=n \
            CONFIG_PLATFORM_ROCKCHIP=n \
            CONFIG_PLATFORM_ALLWINNER=n \
            CONFIG_PLATFORM_HI=n \
            2>&1 | tee /tmp/aic8800_build.log; then
            echo "AIC8800 编译失败"
            tail -30 /tmp/aic8800_build.log
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          mkdir -p /tmp/aic8800_modules
          find "$DRIVER_DIR" -name "*.ko" -exec cp {} /tmp/aic8800_modules/ \;

          if [ -z "$(ls /tmp/aic8800_modules/*.ko 2>/dev/null)" ]; then
            echo "未找到 .ko 文件"
            tail -30 /tmp/aic8800_build.log
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "AIC8800 编译成功:"
          ls -la /tmp/aic8800_modules/
          echo "skip=false" >> $GITHUB_OUTPUT

      # ============================================================
      # Phase 3: 构建 OpenWrt rootfs (仅用户空间)
      # ============================================================
      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.openwrt_version }} \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 rootfs 配置
        run: |
          cd openwrt
          {
          echo "CONFIG_TARGET_armsr=y"
          echo "CONFIG_TARGET_armsr_armv8=y"
          echo "CONFIG_TARGET_ROOTFS_TARGZ=y"
          echo "CONFIG_BINUTILS_VERSION_2_40=y"
          echo "CONFIG_PACKAGE_luci=y"
          echo "CONFIG_PACKAGE_uhttpd=y"
          echo "CONFIG_PACKAGE_uhttpd-mod-ubus=y"
          echo "CONFIG_PACKAGE_rpcd=y"
          echo "CONFIG_PACKAGE_rpcd-mod-file=y"
          echo "CONFIG_PACKAGE_luci-lib-i18n=y"
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y"
          echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y"
          echo "CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y"
          echo "CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y"
          echo "CONFIG_PACKAGE_luci-i18n-wifi-zh-cn=y"
          echo "CONFIG_PACKAGE_wpad-mbedtls=y"
          echo "CONFIG_PACKAGE_iw=y"
          echo "CONFIG_PACKAGE_iwinfo=y"
          echo "CONFIG_PACKAGE_bluez-daemon=y"
          echo "CONFIG_PACKAGE_bluez-utils=y"
          echo "CONFIG_PACKAGE_usbutils=y"
          echo "CONFIG_PACKAGE_libusb-1.0=y"
          echo "CONFIG_PACKAGE_mwan3=y"
          echo "CONFIG_PACKAGE_luci-app-mwan3=y"
          } > .config
          make defconfig

      - name: 下载依赖
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 修复 cp 兼容性
        run: |
          sudo mv /usr/bin/cp /usr/bin/cp.orig
          printf '#!/bin/bash\nargs=()\nfor arg in "$@"; do\n  if [[ "$arg" == "--update" ]]; then args+=("-n")\n  elif [[ "$arg" == --update=* ]]; then args+=("-n")\n  else args+=("$arg"); fi\ndone\nexec /usr/bin/cp.orig "${args[@]}"\n' | sudo tee /usr/bin/cp > /dev/null
          sudo chmod +x /usr/bin/cp

      - name: 编译 OpenWrt rootfs
        run: |
          cd openwrt
          if ! make -j$(nproc) 2>&1 | tee /tmp/openwrt_build.log; then
            echo "并发编译失败，尝试单线程..."
            make -j1 V=s 2>&1 | tee -a /tmp/openwrt_build.log
            exit 1
          fi

      - name: 验证 rootfs 产物
        run: |
          ROOTFS="openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz"
          if [ ! -f "$ROOTFS" ]; then
            echo "rootfs 不存在"
            exit 1
          fi
          echo "rootfs: $(du -h "$ROOTFS" | cut -f1)"

      # ============================================================
      # Phase 4: 打包内核为 ophub 格式 + 组装注入包
      # ============================================================
      - name: 打包内核为 ophub 格式
        run: |
          KVER="${{ env.KVER }}"
          KNAME="${KVER}-self"

          mkdir -p /tmp/kernel_pkg/${KNAME}/{boot,dtb,modules}

          cp /tmp/linux/arch/arm64/boot/Image "/tmp/kernel_pkg/${KNAME}/boot/vmlinuz-${KNAME}"
          cp /tmp/linux/.config "/tmp/kernel_pkg/${KNAME}/boot/config-${KNAME}"
          cp /tmp/linux/System.map "/tmp/kernel_pkg/${KNAME}/boot/System.map-${KNAME}"

          echo | cpio -o -H newc 2>/dev/null | gzip -9 > /tmp/initrd.gz
          mkimage -A arm64 -O linux -T ramdisk -C gzip -d /tmp/initrd.gz \
            "/tmp/kernel_pkg/${KNAME}/boot/uInitrd-${KNAME}"

          cp /tmp/linux/arch/arm64/boot/dts/amlogic/meson-gxl-*.dtb \
            "/tmp/kernel_pkg/${KNAME}/dtb/" 2>/dev/null || true
          cp /tmp/linux/arch/arm64/boot/dts/amlogic/meson-gxm-*.dtb \
            "/tmp/kernel_pkg/${KNAME}/dtb/" 2>/dev/null || true

          if [ ! -f "/tmp/kernel_pkg/${KNAME}/dtb/meson-gxl-s905d-phicomm-n1.dtb" ]; then
            echo "缺少 N1 DTB"
            ls /tmp/kernel_pkg/${KNAME}/dtb/ 2>/dev/null || true
            exit 1
          fi
          echo "N1 DTB 已确认"

          cd /tmp/linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH=/tmp/kernel_pkg/${KNAME}/modules \
            modules_install 2>&1 | tail -5

          find /tmp/kernel_pkg/${KNAME}/modules -type l -name "build" -delete 2>/dev/null || true
          find /tmp/kernel_pkg/${KNAME}/modules -type l -name "source" -delete 2>/dev/null || true

          SKIP="${{ steps.build_aic8800.outputs.skip }}"
          if [ "$SKIP" != "true" ] && [ -d /tmp/aic8800_modules ]; then
            MOD_DIR="/tmp/kernel_pkg/${KNAME}/modules/lib/modules/${KNAME}"
            mkdir -p "${MOD_DIR}/kernel/drivers/aic8800"
            cp /tmp/aic8800_modules/*.ko "${MOD_DIR}/kernel/drivers/aic8800/" 2>/dev/null || true
            echo "AIC8800 模块已装入内核模块目录"
            # 生成模块依赖索引 (modules.alias / modules.dep)，让 modprobe 能按名字找到模块
            depmod -b "/tmp/kernel_pkg/${KNAME}/modules" "${KNAME}" 2>&1 || true
            echo "depmod 完成"
          fi

          cd /tmp/kernel_pkg

          # ophub action 期望的内核包结构: {version}/{board}/(boot|dtb|rootfs/lib/modules/{version})
          # 为 s905d 板子重组目录结构
          # 注意: 必须先创建 rootfs/lib/modules，否则 mv 目标父目录不存在会失败
          mkdir -p "${KNAME}/s905d/rootfs/lib/modules"
          mv "${KNAME}/boot" "${KNAME}/s905d/boot"
          mv "${KNAME}/dtb" "${KNAME}/s905d/dtb"
          mv "${KNAME}/modules/lib/modules/${KNAME}" \
             "${KNAME}/s905d/rootfs/lib/modules/${KNAME}"
          rm -rf "${KNAME}/modules"

          # 断言重组成功
          ls -ld "${KNAME}/s905d/boot" "${KNAME}/s905d/dtb" \
                "${KNAME}/s905d/rootfs/lib/modules/${KNAME}" \
            || { echo "❌ 内核包目录重组失败"; exit 1; }

          # 创建各部分的 tarball (用于 sha256 校验)
          tar czf "${KNAME}/boot-${KNAME}.tar.gz" --owner=0 --group=0 -C "${KNAME}/s905d/boot" .
          tar czf "${KNAME}/dtb-amlogic-${KNAME}.tar.gz" --owner=0 --group=0 -C "${KNAME}/s905d/dtb" .
          tar czf "${KNAME}/modules-${KNAME}.tar.gz" --owner=0 --group=0 -C "${KNAME}/s905d/rootfs" "lib/modules/${KNAME}"

          cd "${KNAME}"
          sha256sum *.tar.gz > sha256sums
          cd ..

          # 打包整个内核包 (包含 s905d 板级目录结构)
          tar czf "/tmp/${KNAME}.tar.gz" --owner=0 --group=0 "${KNAME}"

          echo "内核包打包完成:"
          ls -lh /tmp/${KNAME}.tar.gz
          echo "KNAME=${KNAME}" >> $GITHUB_ENV

      - name: 组装注入包 (固件 + 初始化脚本)
        run: |
          INJECT="$GITHUB_WORKSPACE/inject"
          mkdir -p "$INJECT"/etc/hotplug.d/usb "$INJECT"/etc/uci-defaults "$INJECT"/lib/firmware

          # --- AIC8800 固件 (驱动加载时需要) ---
          if [ -d /tmp/aic8800/fw ]; then
            cp -r /tmp/aic8800/fw/. "$INJECT/lib/firmware/"
            echo "AIC8800 固件已注入"
          fi

          # --- USB 热插拔: 仅处理模式切换，模块加载由内核自动完成 ---
          SKIP="${{ steps.build_aic8800.outputs.skip }}"
          if [ "$SKIP" != "true" ]; then
            printf '#!/bin/sh\n[ "$ACTION" = "add" ] || exit 0\ncase "$PRODUCT" in\n    a69c/8d81/*|368b/8d81/*)\n      modprobe aic_load_fw 2>/dev/null || true\n      sleep 1\n      modprobe aic8800_fdrv 2>/dev/null || true\n      ;;\nesac\nexit 0\n' > "$INJECT/etc/hotplug.d/usb/99-aic8800"
            chmod +x "$INJECT/etc/hotplug.d/usb/99-aic8800"
          fi

          # --- 默认配置 ---
          printf '#!/bin/sh\nuci set network.lan.ipaddr="192.168.10.1"\nuci commit network\nexit 0\n' \
            > "$INJECT/etc/uci-defaults/99-set-lan-ip"
          chmod +x "$INJECT/etc/uci-defaults/99-set-lan-ip"

          printf '#!/bin/sh\nuci set luci.main.lang="zh_cn"\nuci commit luci\nexit 0\n' \
            > "$INJECT/etc/uci-defaults/99-zh-cn"
          chmod +x "$INJECT/etc/uci-defaults/99-zh-cn"

          echo "注入包组装完成 (仅固件+脚本，模块已在内核包中)"
          find "$INJECT" -type f | sort

      # ============================================================
      # Phase 5: 使用 ophub 打包为 N1 固件
      # ============================================================
      - name: 上传内核到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KNAME="${{ env.KNAME }}"
          TAG="kernel_stable"
          ASSET="/tmp/${KNAME}.tar.gz"
          REPO="${{ github.repository }}"

          if [ ! -f "${ASSET}" ]; then
            echo "❌ 内核文件不存在: ${ASSET}"
            exit 1
          fi
          echo "内核文件: ${ASSET} ($(du -h "${ASSET}" | cut -f1))"

          # 删除旧 release (如果存在)
          echo "清理旧 release..."
          gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1 && \
            gh release delete "${TAG}" --cleanup-tag --yes --repo "${REPO}" || \
            echo "旧 release 不存在，跳过删除"

          # 创建新 release 并上传
          echo "创建 release 并上传内核..."
          gh release create "${TAG}" "${ASSET}" \
            --repo "${REPO}" \
            --title "Kernel ${KNAME}" \
            --notes "Self-compiled kernel ${KNAME} for Amlogic S905D (N1)"

          # 验证 release 已创建且包含内核文件
          echo "验证 release..."
          gh release view "${TAG}" --repo "${REPO}"
          echo "检查资产..."
          ASSET_NAME=$(basename "${ASSET}")
          gh release view "${TAG}" --repo "${REPO}" --json assets --jq ".assets[].name" | grep -q "${ASSET_NAME}" || {
            echo "❌ 内核文件未成功上传到 release"
            exit 1
          }
          echo "✅ 内核已上传到 ${REPO} release ${TAG}"
          echo "等待 GitHub 传播 (10 秒)..."
          sleep 10

      - name: 打包 N1 固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ${{ github.repository }}
          kernel_usage: stable
          openwrt_kernel: ${{ env.KNAME }}
          auto_kernel: false
          openwrt_files: inject

      - name: 恢复系统 cp
        if: always()
        run: |
          [ -f /usr/bin/cp.orig ] && sudo mv /usr/bin/cp.orig /usr/bin/cp || true

      # ============================================================
      # Phase 6: 上传产物
      # ============================================================
      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-AX900M-${{ env.KVER }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          if-no-files-found: error

      - name: 推送结果到钉钉
        if: always()
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          KERNEL_VER: ${{ env.KVER }}
        run: |
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="[N1 OpenWrt] 构建成功 (自编译内核: $KERNEL_VER)"
            CONTENT="内核从 mainline Linux 源码编译，AIC8800 WiFi 已包含。"
            SKIP="${{ steps.build_aic8800.outputs.skip }}"
            if [ "$SKIP" = "true" ]; then
              CONTENT="内核已编译，但 AIC8800 WiFi 驱动未成功。"
            fi
          else
            TITLE="[N1 OpenWrt] 构建失败"
            CONTENT="查看日志: $RUN_URL"
          fi
          PAYLOAD=$(jq -n --arg t "$TITLE" --arg c "$CONTENT" --arg u "$RUN_URL" \
            '{msgtype:"text",text:{content:($t+"\n"+$c+"\n"+$u)}}')
          if [ -n "$DINGTALK_TOKEN" ]; then
            if [ -n "$DINGTALK_SECRET" ]; then
              TS=$(date +%s000)
              SIGN=$(echo -n "${TS}\n${DINGTALK_SECRET}" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64 | sed 's/+/%20/g;s/\//%2F/g;s/=/%3D/g')
              WH="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}&timestamp=${TS}&sign=${SIGN}"
            else
              WH="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}"
            fi
            curl -sS -X POST "$WH" -H "Content-Type: application/json" -d "$PAYLOAD" || true
          fi
