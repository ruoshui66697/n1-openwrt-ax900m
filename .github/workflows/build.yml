name: N1 OpenWrt AX900M 固件编译 (绝对同源版)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本分支'
        required: true
        default: 'v24.10.2'
        type: string
      driver_branch:
        description: 'AIC8800 驱动分支 (legacy-mcu1)'
        required: true
        default: 'legacy-mcu1'
        type: choice
        options:
          - main
          - legacy-mcu1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 初始化与前置校验
        run: |
          ERR_FILE="$GITHUB_WORKSPACE/error_log.txt"
          echo "=== Build Error Log ===" > "$ERR_FILE"
          echo "ERR_FILE=$ERR_FILE" >> $GITHUB_ENV

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget bc libelf-dev kmod bzip2 zstd \
            lz4 u-boot-tools cpio dosfstools libtool pkg-config autoconf automake jq

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.openwrt_version }} https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入 AIC8800 OpenWrt Package
        run: |
          cd openwrt
          mkdir -p package/kernel/aic8800
          git clone --depth 1 --branch ${{ github.event.inputs.driver_branch }} https://github.com/shenmintao/aic8800d80.git package/kernel/aic8800/src
          
          find package/kernel/aic8800/src -name "*.c" -exec sed -i 's/AICWFDBG(LOGERROR).*chip unsupport.*/\/\/ Bypassed chip check/g' {} \;
          find package/kernel/aic8800/src -name "*.c" -exec sed -i 's/return -1; \/\/ Unsupported chip/return 0; \/\/ Force support/g' {} \;
          
          cat > package/kernel/aic8800/Makefile <<'MAKEFILE'
          include $(TOPDIR)/rules.mk
          include $(INCLUDE_DIR)/kernel.mk
          include $(INCLUDE_DIR)/package.mk
          
          PKG_NAME:=aic8800
          PKG_RELEASE:=1
          PKG_BUILD_DIR:=$(KERNEL_BUILD_DIR)/$(PKG_NAME)
          
          define KernelPackage/aic8800
            SUBMENU:=Wireless Drivers
            TITLE:=AIC8800 USB WiFi driver
            DEPENDS:=+kmod-cfg80211 +kmod-mac80211 +kmod-usb-core
            FILES:= \
          	$(PKG_BUILD_DIR)/drivers/aic8800/aic_load_fw.ko \
          	$(PKG_BUILD_DIR)/drivers/aic8800/aic8800_fdrv.ko
            AUTOLOAD:=$(call AutoProbe,aic8800_fdrv aic_load_fw)
          endef
          
          define KernelPackage/aic8800/description
            Out-of-tree AIC8800 USB WiFi driver.
          endef
          
          define Build/Prepare
          	rm -rf $(PKG_BUILD_DIR)
          	mkdir -p $(PKG_BUILD_DIR)
          	$(CP) ./src/. $(PKG_BUILD_DIR)/
          endef
          
          define Build/Compile
          	+$(KERNEL_MAKE) $(PKG_JOBS) \
          		M="$(PKG_BUILD_DIR)/drivers/aic8800" \
          		KBUILD_MODPOST_WARN=1 \
          		KBUILD_EXTRA_SYMBOLS="$(KERNEL_BUILD_DIR)/symvers/mac80211.symvers" \
          		modules
          	find $(PKG_BUILD_DIR) -name "*.ko" -exec cp {} $(PKG_BUILD_DIR)/drivers/aic8800/ \;
          	[ -f $(PKG_BUILD_DIR)/drivers/aic8800/aic_load_fw.ko ] || touch $(PKG_BUILD_DIR)/drivers/aic8800/aic_load_fw.ko
          endef
          
          $(eval $(call KernelPackage,aic8800))
          MAKEFILE

      - name: 生成配置
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_BINUTILS_VERSION_2_40=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_luci-lib-i18n=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-wifi-zh-cn=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_bluez-daemon=y
          CONFIG_PACKAGE_bluez-utils=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_kmod-cfg80211=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_libusb-1.0=y
          CONFIG_PACKAGE_kmod-aic8800=y
          EOF
          make defconfig

      - name: 下载依赖与清理
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s
          rm -rf staging_dir/host staging_dir/toolchain-* build_dir/toolchain-* build_dir/host
          make defconfig

      - name: 修复 cp 兼容性
        run: |
          sudo mv /usr/bin/cp /usr/bin/cp.orig
          sudo tee /usr/bin/cp > /dev/null <<'EOF'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" == "--update" ]]; then args+=("-n")
            elif [[ "$arg" == --update=* ]]; then args+=("-n")
            else args+=("$arg"); fi
          done
          exec /usr/bin/cp.orig "${args[@]}"
          EOF
          sudo chmod +x /usr/bin/cp

      - name: 编译 OpenWrt
        run: |
          cd openwrt
          if ! make -j3 2>>"$ERR_FILE"; then
            echo "❌ 并发编译失败，尝试单线程排查..."
            make -j1 V=s 2>&1 | tee -a "$ERR_FILE"
            exit 1
          fi

      - name: 提取内核并发布到当前仓库 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd openwrt
          KREL=$(ls staging_dir/target-*/root-*/lib/modules/ 2>/dev/null | grep -E "^6" | head -n 1)
          if [ -z "$KREL" ]; then
             echo "❌ 找不到内核模块目录，编译失败！"
             exit 1
          fi
          echo "KREL=${KREL}" >> $GITHUB_ENV
          
          LINUX_DIR=$(find build_dir/target-*/linux-*/linux-* -maxdepth 0 -type d | head -n 1)
          if [ ! -d "$LINUX_DIR" ]; then
             echo "❌ 找不到 Linux 编译目录！"
             exit 1
          fi
          
          mkdir -p /tmp/custom_kernel/boot /tmp/custom_kernel/dtb /tmp/custom_kernel/modules
          
          cp "$LINUX_DIR/arch/arm64/boot/Image" /tmp/custom_kernel/boot/vmlinuz-${KREL}
          cp "$LINUX_DIR/.config" /tmp/custom_kernel/boot/config-${KREL}
          cp "$LINUX_DIR/System.map" /tmp/custom_kernel/boot/System.map-${KREL}
          
          cp "$LINUX_DIR"/arch/arm64/boot/dts/amlogic/*.dtb /tmp/custom_kernel/dtb/ 2>/dev/null || true
          
          # 直接将 6.6.93 放入 modules 根下
          cp -a staging_dir/target-*/root-*/lib/modules/${KREL} /tmp/custom_kernel/modules/

          echo "正在生成 uInitrd-${KREL} ..."
          echo | cpio -o -H newc 2>/dev/null | gzip -9 > /tmp/initrd.gz
          mkimage -A arm64 -O linux -T ramdisk -C gzip -d /tmp/initrd.gz /tmp/custom_kernel/boot/uInitrd-${KREL}

          cd /tmp/custom_kernel
          tar czf boot-${KREL}.tar.gz --owner=0 --group=0 -C boot .
          tar czf dtb-amlogic-${KREL}.tar.gz --owner=0 --group=0 -C dtb .
          # 关键：打包 6.6.93 文件夹
          tar czf modules-${KREL}.tar.gz --owner=0 --group=0 -C modules ${KREL}

          mkdir -p wrap/${KREL}
          mv boot-${KREL}.tar.gz dtb-amlogic-${KREL}.tar.gz modules-${KREL}.tar.gz wrap/${KREL}/
          cd wrap/${KREL}
          sha256sum *.tar.gz > sha256sums
          cd ..
          tar czf ${KREL}.tar.gz --owner=0 --group=0 ${KREL}

          gh release delete "kernel_stable" --cleanup-tag -y --repo ${{ github.repository }} 2>/dev/null || true
          gh release create "kernel_stable" ${KREL}.tar.gz --repo ${{ github.repository }} -t "kernel_stable" -n "Kernel: ${KREL}"

      - name: 组装注入包
        run: |
          mkdir -p inject/usr/sbin inject/lib/firmware inject/etc/usb_modeswitch.d inject/etc/hotplug.d/usb inject/etc/profile.d inject/etc/uci-defaults inject/etc/init.d inject/etc/udev/rules.d
          cp -r openwrt/package/kernel/aic8800/src/fw/. inject/lib/firmware/ 2>/dev/null || true

          wget -q "https://github.com/telemt/telemt/releases/download/toolchains/aarch64-linux-musl-cross.tgz" -O /tmp/cross.tgz
          tar xzf /tmp/cross.tgz -C /tmp
          export PATH=/tmp/aarch64-linux-musl-cross/bin:$PATH

          git clone --depth 1 https://github.com/libusb/libusb.git libusb-src || true
          cd libusb-src
          ./autogen.sh --host=aarch64-linux-musl --enable-static --disable-shared --disable-udev --prefix=/tmp/usbroot >/dev/null
          make -j$(nproc) >/dev/null && make install >/dev/null
          cd ..

          curl -fsSL "https://www.draisberghof.de/usb_modeswitch/usb-modeswitch-2.6.1.tar.bz2" -o /tmp/ums.tar.bz2
          tar xjf /tmp/ums.tar.bz2 -C /tmp
          cd /tmp/usb-modeswitch-2.6.1
          aarch64-linux-musl-gcc -static -O2 -o usb_modeswitch usb_modeswitch.c -I/tmp/usbroot/include/libusb-1.0 -L/tmp/usbroot/lib -lusb-1.0 -lpthread 2>>"$ERR_FILE"
          cp usb_modeswitch "$GITHUB_WORKSPACE/inject/usr/sbin/"
          chmod +x "$GITHUB_WORKSPACE/inject/usr/sbin/usb_modeswitch"

          cat > "$GITHUB_WORKSPACE/inject/etc/usb_modeswitch.d/1111:1111" <<'EOF'
          DefaultVendor=0x1111
          DefaultProduct=0x1111
          TargetVendor=0xa69c
          TargetProduct=0x8d81
          MessageContent="555342438765432100000000000010fd0000000000000000000000000000f3"
          MessageContent2="555342438765432100000000000010fd0000000000000000000000000000f2"
          EOF

          cat > "$GITHUB_WORKSPACE/inject/etc/udev/rules.d/99-usb-permissions.rules" <<'EOF'
          SUBSYSTEM=="usb", MODE="0666"
          SUBSYSTEM=="usb_device", MODE="0666"
          EOF

          cat > "$GITHUB_WORKSPACE/inject/usr/sbin/switch_card.sh" <<'EOF'
          #!/bin/sh
          LOCK_FILE="/tmp/.aic8800_switching"
          if [ -f "$LOCK_FILE" ]; then exit 0; fi
          touch "$LOCK_FILE"
          chmod 666 /dev/bus/usb/*/* 2>/dev/null
          /usr/sbin/usb_modeswitch -W -c /etc/usb_modeswitch.d/1111:1111 >/dev/null 2>&1
          rm -f "$LOCK_FILE"
          EOF
          chmod +x "$GITHUB_WORKSPACE/inject/usr/sbin/switch_card.sh"

          cat > "$GITHUB_WORKSPACE/inject/etc/hotplug.d/usb/99-aic8800" <<'EOF'
          #!/bin/sh
          [ "$ACTION" = "add" ] || exit 0
          KVER=$(uname -r)
          MOD_DIR="/lib/modules/${KVER}/kernel/drivers/aic8800"
          case "$PRODUCT" in
              1111/1111/*) sleep 2; /usr/sbin/switch_card.sh ;;
              a69c/8d81/*|368b/8d81/*) 
                  modprobe cfg80211 2>/dev/null
                  modprobe mac80211 2>/dev/null
                  insmod "${MOD_DIR}/aic_load_fw.ko" 2>/dev/null || true
                  insmod "${MOD_DIR}/aic8800_fdrv.ko" 2>/dev/null || true
                  modprobe btusb 2>/dev/null ;;
          esac
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/inject/etc/hotplug.d/usb/99-aic8800"

          cat > "$GITHUB_WORKSPACE/inject/etc/rc.local" <<'EOF'
          #!/bin/sh
          KVER=$(uname -r)
          MOD_DIR="/lib/modules/${KVER}/kernel/drivers/aic8800"
          i=0
          while [ $i -lt 20 ]; do
              if grep -qiE "a69c|368b" /sys/bus/usb/devices/*/idVendor 2>/dev/null; then
                  modprobe cfg80211 2>/dev/null
                  modprobe mac80211 2>/dev/null
                  insmod "${MOD_DIR}/aic_load_fw.ko" 2>/dev/null || true
                  insmod "${MOD_DIR}/aic8800_fdrv.ko" 2>/dev/null || true
                  break
              fi
              if grep -q "1111" /sys/bus/usb/devices/*/idVendor 2>/dev/null; then /usr/sbin/switch_card.sh; fi
              sleep 3; i=$((i+3))
          done
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/inject/etc/rc.local"

          cat > "$GITHUB_WORKSPACE/inject/etc/init.d/usbfs" <<'EOF'
          #!/bin/sh /etc/rc.common
          START=10
          start() {
              mkdir -p /dev/bus/usb
              mountpoint -q /dev/bus/usb || mount -t devtmpfs devtmpfs /dev/bus/usb 2>/dev/null
              [ -x /sbin/udevadm ] && udevadm settle --timeout=5 2>/dev/null
              [ -x /sbin/udevadm ] && udevadm trigger --subsystem-match=usb 2>/dev/null
              for i in 1 2 3; do find /dev/bus/usb -type c -exec chmod 666 {} \; 2>/dev/null; sleep 1; done
          }
          EOF
          chmod +x "$GITHUB_WORKSPACE/inject/etc/init.d/usbfd"

          cat > "$GITHUB_WORKSPACE/inject/etc/uci-defaults/99-zh-cn" <<'EOF'
          #!/bin/sh
          uci set luci.main.lang="zh_cn" 2>/dev/null && uci commit luci 2>/dev/null
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/inject/etc/uci-defaults/99-zh-cn"
          printf '#!/bin/sh\nuci set network.lan.ipaddr="192.168.10.1"\nuci commit network\nexit 0\n' > "$GITHUB_WORKSPACE/inject/etc/uci-defaults/99-set-lan-ip"
          chmod +x "$GITHUB_WORKSPACE/inject/etc/uci-defaults/99-set-lan-ip"

      - name: 修复 rootfs 目录结构以兼容 ophub
        run: |
          ROOTFS_REL="openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz"
          
          echo "🔍 校验内核版本变量..."
          if [ -z "${KREL}" ]; then
            echo "❌ KREL 变量为空，无法修复 rootfs！"
            exit 1
          fi
          echo "✅ 当前内核版本: ${KREL}"

          echo "📦 解压原始 rootfs..."
          rm -rf /tmp/rootfs_fix
          mkdir -p /tmp/rootfs_fix
          tar -xzf "${GITHUB_WORKSPACE}/${ROOTFS_REL}" -C /tmp/rootfs_fix

          echo "🛠️ 注入内核模块并创建兼容目录..."
          mkdir -p /tmp/rootfs_fix/usr/lib/modules
          mkdir -p /tmp/rootfs_fix/lib/modules

          if [ -d "/tmp/custom_kernel/modules/${KREL}" ]; then
            cp -a "/tmp/custom_kernel/modules/${KREL}" /tmp/rootfs_fix/usr/lib/modules/
            cp -a "/tmp/custom_kernel/modules/${KREL}" /tmp/rootfs_fix/lib/modules/
            echo "✅ 内核模块 ${KREL} 注入成功"
          else
            echo "⚠️ 警告: 未找到 /tmp/custom_kernel/modules/${KREL}，仅创建空目录以通过 ophub 校验"
          fi

          echo "🔍 验证目录结构..."
          ls -la /tmp/rootfs_fix/usr/lib/modules/ || true

          echo "📦 重新打包 rootfs (使用相对路径 + .)..."
          cd /tmp/rootfs_fix
          # 使用 GITHUB_WORKSPACE 确保路径绝对安全，使用 . 保留隐藏文件
          tar -czf "${GITHUB_WORKSPACE}/${ROOTFS_REL}" --owner=0 --group=0 .
          cd -

          rm -rf /tmp/rootfs_fix
          echo "✅ rootfs 修复完成！"

      - name: 打包 N1 固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ${{ github.repository }}
          openwrt_kernel: ${{ env.KREL }}
          auto_kernel: false
          openwrt_files: inject

      - name: 恢复系统 cp 命令
        if: always()
        run: |
          if [ -f /usr/bin/cp.orig ]; then sudo mv /usr/bin/cp.orig /usr/bin/cp; fi

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-AX900M-${{ env.KREL }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz

      - name: 构建结果推送到钉钉
        if: always()
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          KERNEL_VER: ${{ env.KREL }}
        run: |
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          ERR_FILE="$GITHUB_WORKSPACE/error_log.txt"
          
          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="[openwrt N1] ✅ 构建成功 (内核: $KERNEL_VER)"
            CONTENT="固件已编译完成，内核版本严格锁定为 $KERNEL_VER。去 Actions 下载刷机即可。"
          else
            TITLE="[openwrt N1] ❌ 构建失败"
            ERR_SUMMARY=""
            if [ -f "$ERR_FILE" ]; then ERR_SUMMARY=$(grep '❌' "$ERR_FILE" | tail -5 || true); fi
            if [ -n "$ERR_SUMMARY" ]; then
              CONTENT="错误摘要:\n${ERR_SUMMARY}\n请查看 Artifacts 中的 build-error-log。"
            else
              CONTENT="请到 Actions 查看失败步骤日志。"
            fi
          fi
          
          FORMATTED_CONTENT=$(printf "%b" "$CONTENT")
          PAYLOAD=$(jq -n --arg title "$TITLE" --arg content "$FORMATTED_CONTENT" --arg url "$RUN_URL" '{msgtype:"text", text:{content: ($title + "\n" + $content + "\n" + $url)}}')
          
          if [ -n "$DINGTALK_SECRET" ]; then
            TIMESTAMP=$(date +%s000)
            STRING_TO_SIGN="${TIMESTAMP}\n${DINGTALK_SECRET}"
            SIGN=$(echo -n "$STRING_TO_SIGN" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64 | sed 's/+/%20/g;s/\//%2F/g;s/=/%3D/g')
            WEBHOOK="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}&timestamp=${TIMESTAMP}&sign=${SIGN}"
          else
            WEBHOOK="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}"
          fi

          RESPONSE=$(curl -sS -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "钉钉接口返回: $RESPONSE"
