name: N1 OpenWrt AX900M 固件编译

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本分支'
        required: true
        default: 'v24.10.2'
        type: string
      driver_branch:
        description: 'AX900M 驱动分支 (一般用 main; 若 dmesg 报 chip_mcu_id=1 选 legacy-mcu1)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - legacy-mcu1

env:
  BUSYBOX_TOOLCHAIN_SHA256: ${{ secrets.BUSYBOX_TOOLCHAIN_SHA256 }}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 初始化与前置校验
        run: |
          ERR_FILE="$GITHUB_WORKSPACE/error_log.txt"
          echo "=== Build Error Log ===" > "$ERR_FILE"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S')" >> "$ERR_FILE"
          echo "Run: ${{ github.run_id }}" >> "$ERR_FILE"
          echo "========================" >> "$ERR_FILE"
          echo "ERR_FILE=$ERR_FILE" >> $GITHUB_ENV
          
          echo ">>> 正在预检驱动分支..."
          if ! git ls-remote --heads https://github.com/shenmintao/aic8800d80.git | grep -q "refs/heads/${{ github.event.inputs.driver_branch }}"; then
            echo "[❌] 驱动分支 ${{ github.event.inputs.driver_branch }} 不存在，请检查输入！"
            exit 1
          fi

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu bc libelf-dev kmod bzip2 \
            zstd lz4 u-boot-tools cpio dosfstools \
            libtool pkg-config autoconf automake jq

      - name: 查询 flippy 内核版本并获取内核配置
        run: |
          log_err() { echo "[❌ $(date '+%H:%M:%S')] $1" | tee -a "$ERR_FILE" >&2; }
          KV=$(curl -fsSL "https://github.com/ophub/kernel/releases/expanded_assets/kernel_stable" | sed -n 's/.*6\.12\.\([0-9]\+\)\.tar\.gz.*/\1/p' | sort -un | tail -1 || true)
          test -n "$KV" || { log_err "查询 flippy 内核版本失败"; exit 1; }
          echo "KV=6.12.${KV}" >> $GITHUB_ENV
          curl -fsSL "https://github.com/ophub/kernel/releases/download/kernel_stable/6.12.${KV}.tar.gz" -o /tmp/k.tar.gz
          tar xzf /tmp/k.tar.gz -C /tmp
          BOOT_TGZ=$(find /tmp -maxdepth 2 -name 'boot-*.tar.gz' 2>/dev/null | head -1 || true)
          test -n "$BOOT_TGZ" || { log_err "内核包结构异常"; exit 1; }
          tar tzf "${BOOT_TGZ}" > /tmp/bootlist 2>/dev/null || true
          CFG=$(grep -m1 -i '^config' /tmp/bootlist 2>/dev/null || true)
          test -n "$CFG" || { log_err "boot 包里没有 config 文件"; exit 1; }
          mkdir -p ksrc
          tar xzf "${BOOT_TGZ}" -O "$CFG" > ksrc/.config 2>/dev/null || true
          test "$(wc -l < ksrc/.config)" -gt 1000 || { log_err ".config 无效"; exit 1; }

      - name: 准备内核源码与 AX900M 驱动源码
        run: |
          log_err() { echo "[❌ $(date '+%H:%M:%S')] $1" | tee -a "$ERR_FILE" >&2; }
          rm -rf ksrc-src
          git clone --depth 100 https://github.com/unifreq/linux-6.12.y.git ksrc-src
          cd ksrc-src
          KV="${{ env.KV }}"
          MATCHED=""
          for c in $(git rev-list -n 100 HEAD); do
            V=$(git show "$c:Makefile" 2>/dev/null | awk -F'= ' '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/{printf "%s.", $2}' | sed 's/\.$//')
            if [ "$V" = "$KV" ]; then
              [ "$c" != "$(git rev-parse HEAD)" ] && git checkout -q "$c"
              MATCHED=1
              break
            fi
          done
          test -n "$MATCHED" || { log_err "未找到与 flippy 内核 $KV 匹配的提交"; exit 1; }
          rm -f .config
          mv ../ksrc/.config .
          scripts/config --set-str LOCALVERSION "" -d LOCALVERSION_AUTO
          printf '#!/bin/sh\nexit 0\n' > scripts/setlocalversion
          : > .scmversion
          cd ..
          git clone --depth 1 --branch ${{ github.event.inputs.driver_branch }} https://github.com/shenmintao/aic8800d80.git aicsrc

      - name: 完整编译内核
        run: |
          log_err() { echo "[❌ $(date '+%H:%M:%S')] $1" | tee -a "$ERR_FILE" >&2; }
          cd ksrc-src
          KV="${{ env.KV }}"
          
          scripts/config -e CONFIG_BLK_DEV_SD
          scripts/config -e CONFIG_BLK_DEV_SR
          scripts/config -e CONFIG_USB_STORAGE
          scripts/config -e CONFIG_USB_UAS
          scripts/config -e CONFIG_SCSI_MOD
          scripts/config -e CONFIG_SCSI
          scripts/config -e CONFIG_EXT4_FS
          scripts/config -e CONFIG_BTRFS_FS
          scripts/config -e CONFIG_FAT_FS
          scripts/config -e CONFIG_VFAT_FS
          scripts/config -e CONFIG_NLS_UTF8
          
          scripts/config -e CONFIG_USB_XHCI_HCD
          scripts/config -e CONFIG_USB_EHCI_HCD
          scripts/config -e CONFIG_USB_DWC3
          scripts/config -e CONFIG_USB_DWC3_MESON_GXL
          scripts/config -e CONFIG_USB_XHCI_PLATFORM
          
          scripts/config -e CONFIG_NET_VENDOR_REALTEK
          scripts/config -e CONFIG_REALTEK_PHY
          scripts/config -e CONFIG_MDIO_BUS_MUX_MESON_GXL
          scripts/config -e CONFIG_DWMAC_MESON
          scripts/config -e CONFIG_STMMAC_ETH
          
          # 【核心修复】scripts/config 不支持 -y，改回 -e (等同于设为 y)
          scripts/config -e CONFIG_WIRELESS
          scripts/config -e CONFIG_CFG80211
          scripts/config -m CONFIG_CFG80211_WEXT
          scripts/config -e CONFIG_MAC80211
          scripts/config -e CONFIG_RFKILL
          
          scripts/config -e CONFIG_USB_DEVICEFS
          scripts/config -e CONFIG_USB_ANNOUNCE_NEW_DEVICES
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # 编译前强制验证关键选项
          echo ">>> 验证内核配置..."
          for opt in CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_WIRELESS CONFIG_USB_DEVICEFS; do
            VAL=$(grep "^${opt}=" .config | head -1)
            echo "  $VAL"
            if echo "$VAL" | grep -q "is not set"; then
              log_err "${opt} 未生效！请检查依赖冲突"
              exit 1
            fi
          done
          
          V=$(awk '/^VERSION = /{print $3}' Makefile)
          P=$(awk '/^PATCHLEVEL = /{print $3}' Makefile)
          S=$(awk '/^SUBLEVEL = /{print $3}' Makefile)
          KREL="${V}.${P}.${S}"
          echo "KREL=${KREL}" >> $GITHUB_ENV
          test "$KREL" = "$KV" || { log_err "KREL($KREL) 与 flippy KV($KV) 不一致"; exit 1; }
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules dtbs 2>>"$ERR_FILE"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=/tmp/kmod INSTALL_MOD_STRIP=1 KERNELRELEASE="${KREL}" DEPMOD=true modules_install
          
          mkdir -p /tmp/kmod/lib/modules/${KREL}/kernel/drivers/aic8800
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=$PWD/../aicsrc/drivers/aic8800 modules 2>>"$ERR_FILE"
          find ../aicsrc/drivers/aic8800 -name '*.ko' -exec cp {} /tmp/kmod/lib/modules/${KREL}/kernel/drivers/aic8800/ \;
          depmod -b /tmp/kmod ${KREL}

      - name: 编译 busybox 静态二进制
        run: |
          wget -q "https://github.com/telemt/telemt/releases/download/toolchains/aarch64-linux-musl-cross.tgz" -O /tmp/aarch64-linux-musl-cross.tgz
          if [ -n "$BUSYBOX_TOOLCHAIN_SHA256" ]; then
              ACTUAL_SHA256=$(sha256sum /tmp/aarch64-linux-musl-cross.tgz | awk '{print $1}')
              if [ "$ACTUAL_SHA256" != "$BUSYBOX_TOOLCHAIN_SHA256" ]; then
                  echo "❌ 工具链 SHA256 校验失败！"; exit 1
              fi
          fi
          
          tar xzf /tmp/aarch64-linux-musl-cross.tgz -C /tmp
          export PATH=/tmp/aarch64-linux-musl-cross/bin:$PATH
          curl -fsSL "https://busybox.net/downloads/busybox-1.36.1.tar.bz2" | tar xj -C /tmp
          cd /tmp/busybox-1.36.1
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-musl- defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/^# CONFIG_BLKID is not set/CONFIG_BLKID=y/' .config
          sed -i 's/^# CONFIG_FINDFS is not set/CONFIG_FINDFS=y/' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-musl- -j$(nproc) 2>>"$ERR_FILE"
          test -x busybox || { echo "busybox 编译失败"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/busybox-root"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-musl- CONFIG_PREFIX="$GITHUB_WORKSPACE/busybox-root" install 2>>"$ERR_FILE"

      - name: 打包内核并发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KV="${{ env.KV }}"
          KREL="${{ env.KREL }}"
          cd ksrc-src
          mkdir -p /tmp/rel/boot /tmp/rel/dtb
          cp arch/arm64/boot/Image /tmp/rel/boot/vmlinuz-${KV}
          cp .config /tmp/rel/boot/config-${KV}
          cp System.map /tmp/rel/boot/System.map-${KV}
          rm -rf /tmp/initrd 
          mkdir -p /tmp/initrd/bin /tmp/initrd/sbin /tmp/initrd/proc /tmp/initrd/sys /tmp/initrd/dev /tmp/initrd/mnt /tmp/initrd/etc /tmp/initrd/tmp /tmp/initrd/var /tmp/initrd/run /tmp/initrd/root /tmp/initrd/lib/modules /tmp/initrd/usr/bin /tmp/initrd/usr/sbin
          cp -a "$GITHUB_WORKSPACE/busybox-root/bin/." /tmp/initrd/bin/
          cp -a "$GITHUB_WORKSPACE/busybox-root/sbin/." /tmp/initrd/sbin/ 2>/dev/null || true
          chmod +x /tmp/initrd/bin/busybox
          
          mkdir -p /tmp/initrd/lib/modules/${KREL}
          cp /tmp/kmod/lib/modules/${KREL}/modules.* /tmp/initrd/lib/modules/${KREL}/ 2>/dev/null || true
          MOD_SRC="/tmp/kmod/lib/modules/${KREL}/kernel"
          MOD_DST="/tmp/initrd/lib/modules/${KREL}/kernel"
          mkdir -p "$MOD_DST"
          
          [ -d "$MOD_SRC/fs/btrfs" ] && mkdir -p "$MOD_DST/fs/btrfs" && find "$MOD_SRC/fs/btrfs" -name '*.ko' -exec cp {} "$MOD_DST/fs/btrfs/" \;
          [ -d "$MOD_SRC/fs/ext4" ] && mkdir -p "$MOD_DST/fs/ext4" && find "$MOD_SRC/fs/ext4" -name '*.ko' -exec cp {} "$MOD_DST/fs/ext4/" \;
          [ -d "$MOD_SRC/drivers/usb/storage" ] && mkdir -p "$MOD_DST/drivers/usb/storage" && find "$MOD_SRC/drivers/usb/storage" -name '*.ko' -exec cp {} "$MOD_DST/drivers/usb/storage/" \;
          [ -d "$MOD_SRC/drivers/scsi" ] && mkdir -p "$MOD_DST/drivers/scsi" && find "$MOD_SRC/drivers/scsi" -name '*.ko' -exec cp {} "$MOD_DST/drivers/scsi/" \;
          
          cat > /tmp/initrd/init <<'INITSCRIPT'
          #!/bin/sh
          exec >/dev/console 2>&1
          export PATH=/bin:/sbin
          echo "=== N1 Custom Initramfs ==="
          mount -t devtmpfs devtmpfs /dev
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mkdir -p /dev/pts /dev/shm
          mount -t devpts devpts /dev/pts
          mount -t tmpfs tmpfs /tmp
          mount -t tmpfs tmpfs /run
          mkdir -p /proc/bus/usb /dev/bus/usb
          mount -t usbfs usbfs /proc/bus/usb 2>/dev/null || true
          mount -t devtmpfs devtmpfs /dev/bus/usb 2>/dev/null || true
          echo "[init] Loading storage modules..."
          for mod in scsi_mod sd_mod usb-storage uas btrfs ext4 fat vfat nls_utf8; do
              modprobe $mod 2>/dev/null
          done
          echo "[init] Waiting for USB storage devices (max 15s)..."
          i=0
          while [ $i -lt 15 ]; do
              FOUND=""
              for d in /dev/sda1 /dev/sda2 /dev/sdb1 /dev/sdb2 /dev/mmcblk2p2 /dev/mmcblk2p3 /dev/mmcblk1p2; do
                  [ -b "$d" ] && { FOUND=1; break; }
              done
              [ -n "$FOUND" ] && break
              sleep 1
              i=$((i+1))
          done
          echo "[init] Device probe finished after ${i}s"
          ROOT_DEV=""
          MOUNT_OPTS=""
          find_root() {
              if [ -x /bin/findfs ]; then
                  ROOT_DEV=$(findfs LABEL=ROOTFS 2>/dev/null)
                  [ -n "$ROOT_DEV" ] && return 0
              fi
              for dev in /dev/sda2 /dev/sda1 /dev/sdb2 /dev/sdb1 /dev/mmcblk2p2 /dev/mmcblk2p3 /dev/mmcblk1p2 /dev/mmcblk1p3; do
                  [ -b "$dev" ] || continue
                  mount -t btrfs -o subvol=ROOTFS,ro "$dev" /mnt 2>/dev/null && { ROOT_DEV="$dev"; MOUNT_OPTS="subvol=ROOTFS"; [ -x /mnt/sbin/init ] && return 0; umount /mnt; }
                  mount -t btrfs -o subvol=@,ro "$dev" /mnt 2>/dev/null && { ROOT_DEV="$dev"; MOUNT_OPTS="subvol=@"; [ -x /mnt/sbin/init ] && return 0; umount /mnt; }
                  mount -t btrfs -o ro "$dev" /mnt 2>/dev/null && { ROOT_DEV="$dev"; [ -x /mnt/sbin/init ] && return 0; umount /mnt; }
                  mount -t ext4 -o ro "$dev" /mnt 2>/dev/null && { ROOT_DEV="$dev"; [ -x /mnt/sbin/init ] && return 0; umount /mnt; }
              done
              return 1
          }
          if ! find_root; then
              sleep 5
              if ! find_root; then
                  echo "!!! FATAL: Cannot mount rootfs !!!"
                  exec /bin/sh
              fi
          fi
          echo "[init] Root found: $ROOT_DEV"
          umount -l /mnt 2>/dev/null || umount /mnt 2>/dev/null || true
          [ -n "$MOUNT_OPTS" ] && mount -t btrfs -o "$MOUNT_OPTS" "$ROOT_DEV" /mnt || mount "$ROOT_DEV" /mnt
          if [ -x /mnt/sbin/init ]; then
              umount /dev/pts 2>/dev/null || true
              umount /dev 2>/dev/null || true
              umount /sys 2>/dev/null || true
              umount /proc 2>/dev/null || true
              umount /tmp 2>/dev/null || true
              umount /run 2>/dev/null || true
              umount /proc/bus/usb 2>/dev/null || true
              umount /dev/bus/usb 2>/dev/null || true
              exec switch_root /mnt /sbin/init
          fi
          echo "!!! /mnt/sbin/init missing !!!"
          exec /bin/sh
          INITSCRIPT
          chmod +x /tmp/initrd/init
          
          (cd /tmp/initrd && find . | cpio -o -H newc 2>/dev/null | gzip -9) > /tmp/initrd.gz
          mkimage -A arm64 -O linux -T ramdisk -C gzip -d /tmp/initrd.gz /tmp/rel/boot/uInitrd-${KV}
          cp arch/arm64/boot/dts/amlogic/*.dtb /tmp/rel/dtb/
          cd /tmp/rel
          tar czf boot-${KV}.tar.gz --owner=0 --group=0 -C boot .
          tar czf dtb-amlogic-${KV}.tar.gz --owner=0 --group=0 -C dtb .
          tar czf modules-${KV}.tar.gz --owner=0 --group=0 -C /tmp/kmod/lib/modules $KREL
          rm -rf /tmp/kv && mkdir -p /tmp/kv && tar xzf modules-${KV}.tar.gz -C /tmp/kv
          test "$(ls /tmp/kv | head -1)" = "$KV" || { echo "模块目录名不一致"; exit 1; }
          mkdir -p wrap/${KV}
          mv boot-${KV}.tar.gz dtb-amlogic-${KV}.tar.gz modules-${KV}.tar.gz wrap/${KV}/
          cd wrap/${KV} && sha256sum *.tar.gz > sha256sums
          cd .. && tar czf ${KV}.tar.gz ${KV}
          test -f "${KV}.tar.gz" || { echo "Release 资产缺失"; exit 1; }
          
          RELEASE_TAG="kernel-${KV}-${{ github.run_number }}"
          gh release create "$RELEASE_TAG" ${KV}.tar.gz --repo ${{ github.repository }} -t "kernel_stable ${KV}" -n "CI custom kernel for N1 + AX900M"
          
          echo ">>> 正在清理旧的 Release..."
          gh release list --repo ${{ github.repository }} --limit 100 \
            | grep "^kernel-[0-9]" \
            | tail -n +6 \
            | awk '{print $1}' \
            | while read tag; do
                echo "Deleting old release: $tag"
                gh release delete "$tag" --cleanup-tag -y --repo ${{ github.repository }} 2>/dev/null || true
              done
              
          rm -rf "$GITHUB_WORKSPACE/ksrc-src" /tmp/kmod /tmp/k.tar.gz "$GITHUB_WORKSPACE/busybox-root" /tmp/aarch64-linux-musl-cross

      - name: 组装注入包
        run: |
          mkdir -p inject/usr/sbin inject/lib/firmware inject/etc/usb_modeswitch.d inject/etc/hotplug.d/usb inject/etc/profile.d inject/etc/uci-defaults inject/etc/init.d
          cp -r aicsrc/fw/. inject/lib/firmware/ 2>/dev/null || true
          
          cat > inject/usr/sbin/switch_card.sh <<'EOF'
          #!/bin/sh
          dev="$1"
          if [ -b "$dev" ]; then
              blockdev --setrw "$dev" 2>/dev/null
              echo -ne "\x55\x53\x42\x43\x12\x34\x56\x78\x00\x00\x00\x00\x00\x00\x10\xfd\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\xf2" | dd of="$dev" bs=31 count=1 2>/dev/null
          fi
          EOF
          chmod +x inject/usr/sbin/switch_card.sh

          cat > inject/etc/hotplug.d/usb/99-aic8800 <<'EOF'
          #!/bin/sh
          [ "$ACTION" = "add" ] || exit 0
          case "$PRODUCT" in
              1111/1111*)
                  sleep 1
                  DEVNAME=$(ls /sys$DEVPATH/host*/target*/*/block/ 2>/dev/null | head -n 1)
                  if [ -n "$DEVNAME" ]; then
                      /usr/sbin/switch_card.sh "/dev/$DEVNAME"
                  fi
                  ;;
              a69c/8d80*|a69c/8d83*)
                  modprobe aic_load_fw 2>/dev/null
                  ;;
              a69c/8d81*|368b/8d81*)
                  modprobe aic8800_fdrv 2>/dev/null
                  modprobe aic_zlp_quirk 2>/dev/null
                  modprobe btusb 2>/dev/null
                  ;;
          esac
          exit 0
          EOF
          chmod +x inject/etc/hotplug.d/usb/99-aic8800
          
          cat > inject/etc/rc.local <<'EOF'
          #!/bin/sh
          i=0
          while [ $i -lt 20 ]; do
              if cat /sys/bus/usb/devices/*/idVendor 2>/dev/null | grep -qiE "a69c|368b"; then
                  modprobe aic_load_fw 2>/dev/null
                  modprobe aic8800_fdrv 2>/dev/null
                  break
              fi
              if cat /sys/bus/usb/devices/*/idVendor 2>/dev/null | grep -q "1111"; then
                  for sd in /dev/sdb /dev/sdc /dev/sdd; do
                      [ -b "$sd" ] && /usr/sbin/switch_card.sh "$sd"
                  done
              fi
              sleep 3
              i=$((i+3))
          done
          exit 0
          EOF
          chmod +x inject/etc/rc.local
          
          printf '#!/bin/sh\necho "==================================="\necho "  CPU Temp: $(( $(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || echo 0) / 1000 )) C"\necho "==================================="\n' > inject/etc/profile.d/30-sysinfo.sh
          chmod +x inject/etc/profile.d/30-sysinfo.sh
          
          cat > inject/etc/init.d/usbfs <<'EOF'
          #!/bin/sh /etc/rc.common
          START=10
          start() {
              mkdir -p /proc/bus/usb /dev/bus/usb
              mountpoint -q /proc/bus/usb || mount -t usbfs usbfs /proc/bus/usb 2>/dev/null
              [ -d /dev/bus/usb ] || mount -t devtmpfs devtmpfs /dev/bus/usb 2>/dev/null
          }
          EOF
          chmod +x inject/etc/init.d/usbfs
          
          cat > inject/etc/uci-defaults/99-zh-cn <<'EOF'
          #!/bin/sh
          for pkg in luci-lib-i18n luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn \
                     luci-i18n-mwan3-zh-cn luci-i18n-opkg-zh-cn luci-i18n-wifi-zh-cn; do
              [ -f "/opt/ipks/${pkg}.ipk" ] && opkg install "/opt/ipks/${pkg}.ipk" 2>/dev/null
          done
          uci set luci.main.lang="zh_cn" 2>/dev/null && uci commit luci 2>/dev/null
          rm -rf /opt/ipks
          exit 0
          EOF
          chmod +x inject/etc/uci-defaults/99-zh-cn
          
          printf '#!/bin/sh\nuci set network.lan.ipaddr="192.168.10.1"\nuci commit network\nexit 0\n' > inject/etc/uci-defaults/99-set-lan-ip
          chmod +x inject/etc/uci-defaults/99-set-lan-ip
          
          cat > inject/etc/uci-defaults/00-firstboot <<'FIRSTBOOT'
          #!/bin/sh
          echo "root:password" | chpasswd
          
          # 1. 启动 usbfs
          /etc/init.d/usbfs enable 2>/dev/null
          /etc/init.d/usbfs start 2>/dev/null
          
          # 2. 等待局域网接口 (br-lan) 就绪，最多等 10 秒
          i=0
          while [ $i -lt 10 ]; do
              if ip a show br-lan 2>/dev/null | grep -q "192.168.10.1"; then
                  break
              fi
              sleep 1
              i=$((i+1))
          done
          
          # 3. 按依赖顺序，稳扎稳打启动服务
          /etc/init.d/dnsmasq enable 2>/dev/null
          /etc/init.d/dnsmasq restart 2>/dev/null
          sleep 2
          
          /etc/init.d/rpcd enable 2>/dev/null
          /etc/init.d/rpcd start 2>/dev/null
          sleep 2
          
          /etc/init.d/uhttpd enable 2>/dev/null
          /etc/init.d/uhttpd start 2>/dev/null
          
          exit 0
          FIRSTBOOT
          chmod +x inject/etc/uci-defaults/00-firstboot

      - name: 准备中文语言包与默认网络
        run: |
          mkdir -p inject/opt/ipks
          REL="${{ github.event.inputs.openwrt_version }}"
          REL="${REL#v}"
          
          ARCH="aarch64_generic"
          REPO="https://downloads.openwrt.org/releases/${REL}/packages/${ARCH}"
          
          download_ipk() {
            local sub="$1" pkg="$2" file
            file=$(curl -fsSL "${REPO}/${sub}/Packages.gz" | gunzip | \
              awk -v p="${pkg}_" '
                BEGIN { found=""; all="" }
                $1=="Filename:" && index($2, p)==1 {
                  if (!found) found=$2
                  if ($2 ~ /_all\.ipk$/) { all=$2 }
                }
                END {
                  if (all != "") print all
                  else if (found != "") print found
                  else exit 1
                }
              ' 2>/dev/null) || true
            case "$file" in */*) ;; *) file="${sub}/${file}" ;; esac
            if [ -n "$file" ]; then
              curl -fsSL "${REPO}/${file}" -o "inject/opt/ipks/${pkg}.ipk" && echo "✅ ${pkg}" || echo "❌ ${pkg} 下载失败"
            else
              echo "❌ 未找到 ${pkg}"
            fi
          }
          
          download_ipk luci luci-lib-i18n
          download_ipk luci luci-i18n-base-zh-cn
          download_ipk luci luci-i18n-firewall-zh-cn
          download_ipk luci luci-i18n-mwan3-zh-cn
          download_ipk luci luci-i18n-opkg-zh-cn
          download_ipk luci luci-i18n-wifi-zh-cn
          
          echo ">>> 校验语言包完整性..."
          MISSING=""
          for pkg in luci-lib-i18n luci-i18n-base-zh-cn; do
              [ -f "inject/opt/ipks/${pkg}.ipk" ] || MISSING="${MISSING} ${pkg}"
          done
          if [ -n "$MISSING" ]; then
            echo "❌ 关键语言包缺失:${MISSING}"
            exit 1
          fi
          echo "✅ 语言包校验通过"

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.openwrt_version }} https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          
          CONFIG_BINUTILS_VERSION_2_40=y
          
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          
          CONFIG_PACKAGE_luci-lib-i18n=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-wifi-zh-cn=y
          
          CONFIG_PACKAGE_wpad-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_bluez-daemon=y
          CONFIG_PACKAGE_bluez-utils=y
          
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          EOF
          make defconfig

      - name: 缓存 OpenWrt 源码包
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: n1-owrt-dl-${{ github.event.inputs.openwrt_version }}-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            n1-owrt-dl-${{ github.event.inputs.openwrt_version }}-

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 清理旧构建产物
        run: |
          cd openwrt
          rm -rf staging_dir/host staging_dir/toolchain-*
          rm -rf build_dir/toolchain-* build_dir/host
          make defconfig

      - name: 临时修复 cp --update 兼容性 Bug
        run: |
          sudo mv /usr/bin/cp /usr/bin/cp.orig
          sudo tee /usr/bin/cp > /dev/null <<'EOF'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" == "--update" ]]; then
              args+=("-n")
            elif [[ "$arg" == --update=* ]]; then
              args+=("-n")
            else
              args+=("$arg")
            fi
          done
          exec /usr/bin/cp.orig "${args[@]}"
          EOF
          sudo chmod +x /usr/bin/cp

      - name: 编译 OpenWrt rootfs
        run: |
          cd openwrt
          if ! make -j$(nproc) 2>>"$ERR_FILE"; then
            make -j1 V=s 2>&1 | tee -a "$ERR_FILE"
            exit 1
          fi

      - name: 打包 N1 固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/*/*/*rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ${{ github.repository }}
          openwrt_kernel: ${{ env.KV }}
          auto_kernel: false
          openwrt_files: inject

      - name: 恢复系统默认 cp 命令
        if: always()
        run: |
          if [ -f /usr/bin/cp.orig ]; then
            sudo mv /usr/bin/cp.orig /usr/bin/cp
          fi

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-AX900M-${{ env.KV }}-${{ github.run_number }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          if-no-files-found: error

      - name: 上传错误日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/error_log.txt
            openwrt/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: 构建结果推送到钉钉
        if: always()
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ERR_FILE="$GITHUB_WORKSPACE/error_log.txt"
          
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="[openwrt N1] ✅ 构建成功"
            CONTENT="固件已编译完成，去 Actions 下载 N1-OpenWrt-AX900M 刷机即可。"
          else
            TITLE="[openwrt N1] ❌ 构建失败"
            ERR_SUMMARY=""
            if [ -f "$ERR_FILE" ]; then ERR_SUMMARY=$(grep '❌' "$ERR_FILE" | tail -5 || true); fi
            if [ -n "$ERR_SUMMARY" ]; then
              CONTENT="错误摘要:\n${ERR_SUMMARY}\n请查看 Artifacts 中的 build-error-log。"
            else
              CONTENT="请到 Actions 查看失败步骤日志。"
            fi
          fi
          
          FORMATTED_CONTENT=$(printf "%b" "$CONTENT")
          PAYLOAD=$(jq -n --arg title "$TITLE" --arg content "$FORMATTED_CONTENT" --arg url "$RUN_URL" '{msgtype:"text", text:{content: ($title + "\n" + $content + "\n" + $url)}}')
          
          if [ -n "$DINGTALK_SECRET" ]; then
            TIMESTAMP=$(date +%s000)
            STRING_TO_SIGN="${TIMESTAMP}\n${DINGTALK_SECRET}"
            SIGN=$(echo -n "$STRING_TO_SIGN" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64 | sed 's/+/%20/g;s/\//%2F/g;s/=/%3D/g')
            WEBHOOK="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}&timestamp=${TIMESTAMP}&sign=${SIGN}"
          else
            WEBHOOK="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_TOKEN}"
          fi

          RESPONSE=$(curl -sS -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "钉钉接口返回: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"errcode":0'; then
            echo "✅ 钉钉通知发送成功"
          else
            echo "❌ 钉钉通知发送失败"
          fi
