name: N1 OpenWrt AX900M 固件编译

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本分支'
        required: true
        default: 'v24.10.2'
      driver_branch:
        description: 'AX900M 驱动分支 (一般用 main; 若 dmesg 报 chip_mcu_id=1 选 legacy-mcu1)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - legacy-mcu1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu bc libelf-dev kmod bzip2 \
            zstd lz4 u-boot-tools cpio

      - name: 查询 flippy 内核版本并获取内核配置
        run: |
          KV=$(curl -fsSL "https://github.com/ophub/kernel/releases/expanded_assets/kernel_stable" \
               | grep -oP '6\.12\.\K[0-9]+(?=\.tar\.gz)' | sort -un | tail -1 || true)
          test -n "$KV" || { echo "查询 flippy 内核版本失败"; exit 1; }
          echo "KV=6.12.${KV}" >> $GITHUB_ENV
          echo ">>> flippy 内核: 6.12.${KV}"
          # 下载官方内核包,只为取里面的 .config(构建配置必须与之一致)
          curl -fsSL "https://github.com/ophub/kernel/releases/download/kernel_stable/6.12.${KV}.tar.gz" -o /tmp/k.tar.gz
          tar xzf /tmp/k.tar.gz -C /tmp
          BOOT_TGZ=$(find /tmp -maxdepth 2 -name 'boot-*.tar.gz' 2>/dev/null | head -1 || true)
          test -n "$BOOT_TGZ" || { echo "内核包结构异常,把日志发我"; exit 1; }
          tar tzf "${BOOT_TGZ}" > /tmp/bootlist 2>/dev/null || true
          CFG=$(grep -m1 -i '^config' /tmp/bootlist 2>/dev/null || true)
          test -n "$CFG" || { echo "boot 包里没有 config 文件,把日志发我"; exit 1; }
          mkdir -p ksrc
          tar xzf "${BOOT_TGZ}" -O "$CFG" > ksrc/.config 2>/dev/null || true
          test "$(wc -l < ksrc/.config)" -gt 1000 || { echo ".config 无效,把日志发我"; exit 1; }
          echo ">>> 内核配置已获取 ($(wc -l < ksrc/.config) 行)"
          grep -E 'CONFIG_MODULE_UNLOAD|CONFIG_MODULE_SIG=|CONFIG_LIVEPATCH|CONFIG_TRACING=' ksrc/.config || true

      - name: 准备内核源码与 AX900M 驱动源码
        run: |
          rm -rf ksrc-src && git clone --depth 1 https://github.com/unifreq/linux-6.12.y.git ksrc-src
          cd ksrc-src
          KV="${{ env.KV }}"
          # 源码锁定到与发布版本一致的提交
          for c in $(git rev-list -n 5 HEAD); do
            V=$(git show "$c:Makefile" 2>/dev/null | awk -F'= ' '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/{printf "%s.", $2}' | sed 's/\.$//')
            if [ "$V" = "$KV" ]; then
              [ "$c" != "$(git rev-parse HEAD)" ] && git checkout -q "$c"
              break
            fi
          done
          echo ">>> 源码版本: $(awk -F'= ' '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/{printf "%s.", $2}' Makefile | sed 's/\.$//') (目标 $KV)"
          # 放入官方配置,去掉 -ophub 后缀(保证版本号与 ophub 匹配规则兼容)
          rm -f .config
          mv ../ksrc/.config .
          scripts/config --set-str LOCALVERSION ""
          cd ..
          # AX900M 驱动源码
          git clone --depth 1 --branch ${{ github.event.inputs.driver_branch }} \
            https://github.com/shenmintao/aic8800d80.git aicsrc
          echo ">>> 驱动固件:"; ls aicsrc/fw/ || true

      - name: 完整编译内核(内核+dtb+模块+AX900M驱动,同一构建树)
        run: |
          cd ksrc-src
          KV="${{ env.KV }}"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules dtbs
          make ARCH=arm64 INSTALL_MOD_PATH=/tmp/kmod modules_install
          # AX900M 驱动与内核同源编译,混入模块树
          mkdir -p /tmp/kmod/lib/modules/${KV}/extra/aic8800
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=$PWD/../aicsrc/drivers/aic8800 modules
          cp ../aicsrc/drivers/aic8800/aic_load_fw.ko \
             ../aicsrc/drivers/aic8800/aic8800_fdrv.ko \
             ../aicsrc/drivers/aic8800/aic_zlp_quirk.ko \
             /tmp/kmod/lib/modules/${KV}/extra/aic8800/
          depmod -b /tmp/kmod ${KV}
          echo ">>> 内核: $(make -s kernelversion)"
          echo ">>> AX900M 驱动已编入模块树:"
          ls -la /tmp/kmod/lib/modules/${KV}/extra/aic8800/

      - name: 编译 usb_modeswitch 静态二进制
        run: |
          git clone --depth 1 https://github.com/libusb/libusb.git libusb-src || true
          if [ -d libusb-src ]; then
            cd libusb-src
            if [ -x ./autogen.sh ]; then
              ./autogen.sh --host=aarch64-linux-gnu --enable-static --disable-shared \
                --disable-udev --prefix=/tmp/usbroot >/dev/null
            else
              ./bootstrap.sh && ./configure --host=aarch64-linux-gnu \
                --enable-static --disable-shared --disable-udev --prefix=/tmp/usbroot >/dev/null
            fi
            make -j$(nproc) >/dev/null && make install >/dev/null
            cd ..
          fi
          curl -fsSL "https://www.draisberghof.de/usb_modeswitch/usb-modeswitch-2.6.1.tar.bz2" -o /tmp/ums.tar.bz2
          tar xjf /tmp/ums.tar.bz2 -C /tmp
          cd /tmp/usb-modeswitch-2.6.1
          set +e
          aarch64-linux-gnu-gcc -static -O2 -o usb_modeswitch usb_modeswitch.c \
            -I/tmp/usbroot/include/libusb-1.0 -L/tmp/usbroot/lib -lusb-1.0 -lpthread
          RC=$?
          set -e
          [ $RC -eq 0 ] && echo ">>> usb_modeswitch 编译成功" || echo ">>> usb_modeswitch 编译失败(rc=$RC)"
          ls -la usb_modeswitch || true
          file usb_modeswitch || true
          cp usb_modeswitch "$OLDPWD/" 2>/dev/null || true

      - name: 打包内核并发布 Release(ophub 格式)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KV="${{ env.KV }}"
          cd ksrc-src
          test -f arch/arm64/boot/Image || { echo "内核未编译成功"; exit 1; }
          mkdir -p /tmp/rel/boot /tmp/rel/dtb
          cp arch/arm64/boot/Image /tmp/rel/boot/vmlinuz-${KV}
          cp .config /tmp/rel/boot/config-${KV}
          cp System.map /tmp/rel/boot/System.map-${KV}
          # 最小 initramfs(空 cpio,内核无 /init 时自动回退 root= 挂载)
          rm -rf /tmp/initrd && mkdir -p /tmp/initrd
          (cd /tmp/initrd && find . | cpio -o -H newc 2>/dev/null | gzip -9) > /tmp/initrd.gz
          mkimage -A arm64 -O linux -T ramdisk -C gzip -d /tmp/initrd.gz \
            /tmp/rel/boot/uInitrd-${KV} 2>/dev/null || cp /tmp/initrd.gz /tmp/rel/boot/uInitrd-${KV}
          # amlogic 全部 dtb(ophub 要求 dtb/amlogic 下至少 2 个文件)
          cp arch/arm64/boot/dts/amlogic/*.dtb /tmp/rel/dtb/
          cd /tmp/rel
          tar czf boot-${KV}.tar.gz -C boot .
          tar czf dtb-amlogic-${KV}.tar.gz -C dtb .
          tar czf modules-${KV}.tar.gz -C /tmp/kmod/lib/modules ${KV}
          ls -lh *.tar.gz
          mkdir -p wrap && mv boot-${KV}.tar.gz dtb-amlogic-${KV}.tar.gz modules-${KV}.tar.gz wrap/
          cd wrap && sha256sum *.tar.gz > sha256sums
          tar czf ${KV}.tar.gz boot-${KV}.tar.gz dtb-amlogic-${KV}.tar.gz modules-${KV}.tar.gz sha256sums
          echo ">>> 发布内核 Release (kernel_stable/${KV}.tar.gz)"
          gh release delete kernel_stable --cleanup-tag -y 2>/dev/null || true
          gh release create kernel_stable ${KV}.tar.gz \
            -t "kernel_stable ${KV}" -n "CI custom kernel for N1 + AX900M"
          # 释放磁盘空间
          rm -rf "$GITHUB_WORKSPACE/ksrc-src" /tmp/kmod /tmp/k.tar.gz "$GITHUB_WORKSPACE/libusb-src"
          df -h "$GITHUB_WORKSPACE" | tail -1

      - name: 组装注入包
        run: |
          mkdir -p inject/opt/bin inject/lib/firmware \
                   inject/etc/usb_modeswitch.d inject/etc/custom_service \
                   inject/etc/hotplug.d/usb inject/etc/profile.d
          cp usb_modeswitch inject/opt/bin/ 2>/dev/null || true
          cp -r aicsrc/fw/. inject/lib/firmware/ 2>/dev/null || true
          find aicsrc -path '*modeswitch*' -type f ! -name '*.md' \
            -exec cp {} "inject/etc/usb_modeswitch.d/1111:1111" \; 2>/dev/null || true
          cat > inject/etc/hotplug.d/usb/99-aic8800 <<'EOF'
          #!/bin/sh
          # AX900M (AIC8800D80) 热插拔自动加载(驱动已随内核模块树安装)
          [ "$ACTION" = "add" ] || exit 0
          case "$PRODUCT" in
              a69c:8d80*|a69c:8d83*)
                  modprobe aic_load_fw 2>/dev/null ;;
              a69c:8d81*|368b:8d81*)
                  modprobe cfg80211 2>/dev/null
                  modprobe aic8800_fdrv 2>/dev/null
                  modprobe aic_zlp_quirk 2>/dev/null
                  modprobe btusb 2>/dev/null ;;
          esac
          exit 0
          EOF
          chmod +x inject/etc/hotplug.d/usb/99-aic8800
          cat > inject/etc/custom_service/start_service.sh <<'EOF'
          #!/bin/sh
          # 等待 AX900M 完成模式切换(驱动已由热插拔脚本自动加载)
          i=0
          while [ $i -lt 40 ]; do
              lsusb | grep -qiE 'a69c|368b' && break
              if lsusb | grep -q "1111:1111"; then
                  usb_modeswitch -v 0x1111 -p 0x1111 \
                    -M 555342438765432100000000000010fd0000000000000000000000000000f3 \
                    -M 555342438765432100000000000010fd0000000000000000000000000000f2 >/dev/null 2>&1
              fi
              sleep 3; i=$((i+3))
          done
          exit 0
          EOF
          chmod +x inject/etc/custom_service/start_service.sh
          printf '#!/bin/sh\n# 覆盖原脚本的 ash 语法报错(只能纯注释,不能有exit,profile.d被登录shell内嵌执行,exit会杀掉shell)\n:\n' > inject/etc/profile.d/30-sysinfo.sh
          echo ">>> 注入包:"
          find inject -type f | sort || true
          ls -la inject/opt/bin/ || true
          rm -rf aicsrc

      - name: 上传救急工具包
        uses: actions/upload-artifact@v4
        with:
          name: ax900m-modules
          path: inject/opt/bin/
          if-no-files-found: error

      - name: 准备中文语言包(离线注入)
        run: |
          mkdir -p inject/opt/ipks inject/etc/uci-defaults
          REL="${{ github.event.inputs.openwrt_version }}"
          REL="${REL#v}"
          REPO="https://downloads.openwrt.org/releases/${REL}/packages/aarch64_generic"
          download_ipk() {
            local sub="$1" pkg="$2" file
            file=$(curl -fsSL "${REPO}/${sub}/Packages.gz" | gunzip \
                   | awk -v p="${pkg}_" '$1=="Filename:" && $2 ~ p {print $2; exit}' || true)
            case "$file" in
              */*) ;;
              *) file="${sub}/${file}" ;;
            esac
            if [ -n "$file" ]; then
              curl -fsSL "${REPO}/${file}" -o "inject/opt/ipks/${pkg}.ipk" \
                && echo ">>> 已下载 ${pkg}" || echo ">>> 下载失败 ${pkg}"
            else
              echo ">>> 仓库里没找到 ${pkg}"
            fi
          }
          download_ipk luci luci-i18n-base-zh-cn
          download_ipk luci luci-i18n-firewall-zh-cn
          download_ipk luci luci-i18n-mwan3-zh-cn
          ls -la inject/opt/ipks/ || true
          cat > inject/etc/uci-defaults/99-zh-cn <<'EOF'
          #!/bin/sh
          opkg install /opt/ipks/luci-i18n-*.ipk 2>/dev/null
          opkg install --force-reinstall /opt/ipks/luci-i18n-*.ipk 2>/dev/null
          for d in /usr/sbin /usr/bin /sbin /bin; do
              cp /opt/bin/usb_modeswitch "$d/" 2>/dev/null
          done
          uci set luci.main.lang='zh_cn' 2>/dev/null && uci commit luci 2>/dev/null
          exit 0
          EOF
          chmod +x inject/etc/uci-defaults/99-zh-cn

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.openwrt_version }} \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置(无需仓库内 config 文件)
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_bluez-daemon=y
          CONFIG_PACKAGE_bluez-utils=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y
          EOF
          sed -i 's/^          //' .config
          make defconfig

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译 OpenWrt rootfs
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          ls -lh bin/targets/armsr/armv8/*rootfs.tar.gz

      - name: 升级 coreutils(ophub 脚本需要新版 cp 语法)
        run: |
          curl -fsSL https://ftp.gnu.org/gnu/coreutils/coreutils-9.9.tar.xz | tar xJ
          cd coreutils-9.9
          ./configure --quiet >/dev/null
          make -j$(nproc) >/dev/null
          sudo make install >/dev/null
          hash -r
          cp --version | head -1
          cp --update=none --version >/dev/null && echo ">>> cp --update=none 已支持" || true

      - name: 打包 N1 固件(使用自编译内核)
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/*/*/*rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ${{ github.repository }}
          openwrt_kernel: ${{ env.KV }}
          auto_kernel: false
          openwrt_files: inject

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-AX900M
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          if-no-files-found: error
