name: N1 OpenWrt AX900M 固件编译

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本分支'
        required: true
        default: 'v24.10.2'
      driver_branch:
        description: 'AX900M 驱动分支 (一般用 main; 若 dmesg 报 chip_mcu_id=1 选 legacy-mcu1)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - legacy-mcu1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu bc libelf-dev kmod

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.openwrt_version }} \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置(无需仓库内 config 文件)
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_bluez-daemon=y
          CONFIG_PACKAGE_bluez-utils=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y
          EOF
          sed -i 's/^          //' .config
          make defconfig

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译 OpenWrt rootfs
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          ls -lh bin/targets/armsr/armv8/*rootfs.tar.gz

      - name: 查询 flippy 内核精确版本
        run: |
          KV=$(curl -fsSL "https://github.com/ophub/kernel/releases/expanded_assets/kernel_stable" \
               | grep -oP '6\.12\.\K[0-9]+(?=\.tar\.gz)' | sort -un | tail -1)
          test -n "$KV" || { echo "查询 flippy 内核版本失败"; exit 1; }
          echo "KV=6.12.${KV}" >> $GITHUB_ENV
          echo ">>> flippy 内核: 6.12.${KV}"

      - name: 准备 flippy 内核构建树
        run: |
          sudo apt-get install -y zstd lz4
          git clone --depth 1 https://github.com/unifreq/linux-6.12.y.git ksrc
          cd ksrc
          curl -fsSL "https://github.com/ophub/kernel/releases/download/kernel_stable/${{ env.KV }}.tar.gz" -o /tmp/k.tar.gz
          tar xzf /tmp/k.tar.gz -C /tmp
          BOOT_TGZ=$(find /tmp -maxdepth 2 -name 'boot-*.tar.gz' 2>/dev/null | head -1)
          test -n "$BOOT_TGZ" || { echo "内核包结构异常,把日志发我"; exit 1; }
          CFG=$(tar tzf "${BOOT_TGZ}" | grep -m1 -i 'config')
          test -n "$CFG" || { echo "boot 包中没有 config,把日志发我"; exit 1; }
          tar xzf "${BOOT_TGZ}" -O "$CFG" > .config 2>/dev/null
          # 尝试从内核镜像提取导出符号表生成 Module.symvers
          mkdir -p /tmp/boot && tar xzf "${BOOT_TGZ}" -C /tmp/boot 2>/dev/null
          zimg=$(find /tmp/boot \( -name 'zImage*' -o -name 'vmlinuz*' \) 2>/dev/null | head -1)
          echo ">>> 内核镜像: ${zimg}"
          if [ -n "$zimg" ] && scripts/extract-vmlinux "$zimg" > /tmp/vmlinux 2>/dev/null && [ -s /tmp/vmlinux ]; then
            aarch64-linux-gnu-nm /tmp/vmlinux | awk '$3 ~ /^__ksymtab_/ {
                s=$3; sub(/^__ksymtab_/,"",s);
                sub(/^gpl_unused_/,"",s); sub(/^gpl_future_/,"",s);
                sub(/^unused_/,"",s); sub(/^gpl_/,"",s);
                if (s != "strings" && s != "") print "0x00000000\t" s "\tvmlinux"
            }' | sort -u > Module.symvers
            echo ">>> 内核导出符号数: $(wc -l < Module.symvers)"
          else
            echo ">>> 内核镜像解包失败,改用 KBUILD_MODPOST_WARN 模式"
            echo "KMOD_WARN=1" >> $GITHUB_ENV
          fi
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)
          echo "${{ env.KV }}" > include/config/kernel.release
          sed -i "s/UTS_RELEASE \".*\"/UTS_RELEASE \"${{ env.KV }}\"/" include/generated/utsrelease.h
          echo ">>> 内核构建树: $(cat include/config/kernel.release)"

      - name: 编译 AX900M 驱动(against flippy 内核)
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.driver_branch }} \
            https://github.com/shenmintao/aic8800d80.git aicsrc
          echo ">>> 驱动固件:"
          ls aicsrc/fw/
          if [ "${{ env.KMOD_WARN }}" = "1" ]; then
            make -C ksrc ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              M=$PWD/aicsrc/drivers/aic8800 KBUILD_MODPOST_WARN=1 modules
          else
            make -C ksrc ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              M=$PWD/aicsrc/drivers/aic8800 modules
          fi
          find aicsrc -name '*.ko' | sort
          echo ">>> vermagic 校验(必须等于 ${{ env.KV }}):"
          find aicsrc -name '*.ko' -exec modinfo {} \; | grep vermagic

      - name: 准备中文语言包与模式切换工具(离线注入)
        run: |
          mkdir -p inject/opt/ipks inject/etc/uci-defaults
          REL="${{ github.event.inputs.openwrt_version }}"
          REL="${REL#v}"
          REPO="https://downloads.openwrt.org/releases/${REL}/packages/aarch64_generic"
          # 下载 ipk 到固件,首次开机离线安装(不依赖 CONFIG 内置,不依赖盒子联网)
          download_ipk() {
            local sub="$1" pkg="$2"
            local file
            file=$(curl -fsSL "${REPO}/${sub}/Packages.gz" | gunzip \
                   | grep "^Filename: .*${pkg}_" | head -1 | awk '{print $2}')
            case "$file" in
              */*) ;;
              *) file="${sub}/${file}" ;;
            esac
            if [ -n "$file" ]; then
              curl -fsSL "${REPO}/${file}" -o "inject/opt/ipks/$(basename "${file}")" \
                && echo ">>> 已下载 ${pkg}"
            else
              echo ">>> 仓库里没找到 ${pkg}(忽略)"
            fi
          }
          download_ipk luci luci-i18n-base-zh-cn
          download_ipk luci luci-i18n-firewall-zh-cn
          download_ipk luci luci-i18n-mwan3-zh-cn
          download_ipk packages usb-modeswitch
          # 首次开机:离线装语言包+切换工具,并设置默认中文
          cat > inject/etc/uci-defaults/99-zh-cn <<'EOF'
          #!/bin/sh
          opkg install /opt/ipks/luci-i18n-*.ipk /opt/ipks/usb-modeswitch_*.ipk 2>/dev/null
          uci set luci.main.lang='zh_cn' 2>/dev/null && uci commit luci 2>/dev/null
          exit 0
          EOF
          chmod +x inject/etc/uci-defaults/99-zh-cn

      - name: 组装驱动注入包
        run: |
          mkdir -p inject/opt/aic8800 inject/lib/firmware \
                   inject/etc/usb_modeswitch.d inject/etc/custom_service \
                   inject/etc/hotplug.d/usb
          # 1. 驱动模块放 /opt/aic8800 —— 不能放 /lib/modules,
          #    ophub 打包替换内核时会清空 /lib/modules,放那里会被删掉
          find aicsrc -name '*.ko' -exec cp {} inject/opt/aic8800/ \;
          # 2. 固件: /lib/firmware 一份 + /opt 备份一份(启动时自愈)
          cp -r aicsrc/fw/. inject/lib/firmware/ 2>/dev/null || true
          cp -r aicsrc/fw/. inject/opt/aic8800/fw/ 2>/dev/null || true
          # 3. 1111:1111 假光盘模式的切换规则
          find aicsrc -path '*modeswitch*' -type f ! -name '*.md' \
            -exec cp {} "inject/etc/usb_modeswitch.d/1111:1111" \; 2>/dev/null || true
          # 4. 热插拔自动加载: 插入 AX900M 自动加载驱动,无需重启
          cat > inject/etc/hotplug.d/usb/99-aic8800 <<'EOF'
          #!/bin/sh
          # AX900M (AIC8800D80) 热插拔自动加载
          [ "$ACTION" = "add" ] || exit 0
          case "$PRODUCT" in
              a69c:8d80*|a69c:8d83*)
                  insmod /opt/aic8800/aic_load_fw.ko 2>/dev/null ;;
              a69c:8d81*|368b:8d81*)
                  modprobe cfg80211 2>/dev/null
                  insmod /opt/aic8800/aic8800_fdrv.ko 2>/dev/null
                  insmod /opt/aic8800/aic_zlp_quirk.ko 2>/dev/null
                  modprobe btusb 2>/dev/null ;;
          esac
          exit 0
          EOF
          chmod +x inject/etc/hotplug.d/usb/99-aic8800
          # 5. 开机脚本: 确保完成模式切换(防止开机时热插拔事件没触发切换)
          cat > inject/etc/custom_service/start_service.sh <<'EOF'
          #!/bin/sh
          i=0
          while [ $i -lt 40 ]; do
              lsusb | grep -qiE 'a69c|368b' && break
              if lsusb | grep -q "1111:1111"; then
                  usb_modeswitch -v 0x1111 -p 0x1111 \
                    -M 555342438765432100000000000010fd0000000000000000000000000000f3 \
                    -M 555342438765432100000000000010fd0000000000000000000000000000f2 >/dev/null 2>&1
              fi
              sleep 3; i=$((i+3))
          done
          sleep 2
          [ -d /lib/firmware/aic8800D80 ] || cp -r /opt/aic8800/fw/. /lib/firmware/ 2>/dev/null
          modprobe cfg80211 2>/dev/null
          insmod /opt/aic8800/aic_load_fw.ko 2>/dev/null
          sleep 3
          insmod /opt/aic8800/aic8800_fdrv.ko 2>/dev/null
          insmod /opt/aic8800/aic_zlp_quirk.ko 2>/dev/null
          modprobe btusb 2>/dev/null
          exit 0
          EOF
          chmod +x inject/etc/custom_service/start_service.sh
          echo ">>> 注入包:"
          find inject -type f | sort

      - name: 升级 coreutils(ophub 脚本需要新版 cp 语法)
        run: |
          curl -fsSL https://ftp.gnu.org/gnu/coreutils/coreutils-9.9.tar.xz | tar xJ
          cd coreutils-9.9
          ./configure --quiet >/dev/null
          make -j$(nproc) >/dev/null
          sudo make install >/dev/null
          hash -r
          cp --version | head -1
          cp --update=none --version >/dev/null && echo ">>> cp --update=none 已支持"

      - name: 打包 N1 固件(ophub)
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/*/*/*rootfs.tar.gz
          openwrt_board: s905d
          openwrt_kernel: ${{ env.KV }}
          auto_kernel: false
          openwrt_files: inject

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-AX900M
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          if-no-files-found: error
