name: N1 OpenWrt AX900M 固件编译

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本分支'
        required: true
        default: 'v24.10.2'
      driver_branch:
        description: 'AX900M 驱动分支 (一般用 main; 若 dmesg 报 chip_mcu_id=1 选 legacy-mcu1)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - legacy-mcu1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 初始化错误日志
        run: |
          ERR_FILE="$GITHUB_WORKSPACE/error_log.txt"
          echo "=== Build Error Log ===" > "$ERR_FILE"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S')" >> "$ERR_FILE"
          echo "Run: ${{ github.run_id }}" >> "$ERR_FILE"
          echo "========================" >> "$ERR_FILE"
          echo "ERR_FILE=$ERR_FILE" >> $GITHUB_ENV

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu bc libelf-dev kmod bzip2 \
            zstd lz4 u-boot-tools cpio

      - name: 查询 flippy 内核版本并获取内核配置
        run: |
          log_err() { echo "[❌ $(date '+%H:%M:%S')] $1" | tee -a "$ERR_FILE" >&2; }
          
          KV=$(curl -fsSL "https://github.com/ophub/kernel/releases/expanded_assets/kernel_stable" | grep -oP '6\.12\.\K[0-9]+(?=\.tar\.gz)' | sort -un | tail -1 || true)
          test -n "$KV" || { log_err "查询 flippy 内核版本失败"; exit 1; }
          echo "KV=6.12.${KV}" >> $GITHUB_ENV
          echo ">>> flippy 内核: 6.12.${KV}"
          
          curl -fsSL "https://github.com/ophub/kernel/releases/download/kernel_stable/6.12.${KV}.tar.gz" -o /tmp/k.tar.gz
          tar xzf /tmp/k.tar.gz -C /tmp
          
          BOOT_TGZ=$(find /tmp -maxdepth 2 -name 'boot-*.tar.gz' 2>/dev/null | head -1 || true)
          test -n "$BOOT_TGZ" || { log_err "内核包结构异常"; exit 1; }
          
          tar tzf "${BOOT_TGZ}" > /tmp/bootlist 2>/dev/null || true
          CFG=$(grep -m1 -i '^config' /tmp/bootlist 2>/dev/null || true)
          test -n "$CFG" || { log_err "boot 包里没有 config 文件"; exit 1; }
          
          mkdir -p ksrc
          tar xzf "${BOOT_TGZ}" -O "$CFG" > ksrc/.config 2>/dev/null || true
          test "$(wc -l < ksrc/.config)" -gt 1000 || { log_err ".config 无效"; exit 1; }

      - name: 准备内核源码与 AX900M 驱动源码
        run: |
          log_err() { echo "[❌ $(date '+%H:%M:%S')] $1" | tee -a "$ERR_FILE" >&2; }
          
          rm -rf ksrc-src && git clone --depth 1 https://github.com/unifreq/linux-6.12.y.git ksrc-src
          cd ksrc-src
          KV="${{ env.KV }}"
          for c in $(git rev-list -n 5 HEAD); do
            V=$(git show "$c:Makefile" 2>/dev/null | awk -F'= ' '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/{printf "%s.", $2}' | sed 's/\.$//')
            if [ "$V" = "$KV" ]; then
              [ "$c" != "$(git rev-parse HEAD)" ] && git checkout -q "$c"
              break
            fi
          done
          rm -f .config
          mv ../ksrc/.config .
          scripts/config --set-str LOCALVERSION "" -d LOCALVERSION_AUTO
          printf '#!/bin/sh\nexit 0\n' > scripts/setlocalversion
          : > .scmversion
          cd ..
          git clone --depth 1 --branch ${{ github.event.inputs.driver_branch }} \
            https://github.com/shenmintao/aic8800d80.git aicsrc

      - name: 完整编译内核
        run: |
          log_err() { echo "[❌ $(date '+%H:%M:%S')] $1" | tee -a "$ERR_FILE" >&2; }
          cd ksrc-src
          KV="${{ env.KV }}"
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          V=$(awk '/^VERSION = /{print $3}' Makefile)
          P=$(awk '/^PATCHLEVEL = /{print $3}' Makefile)
          S=$(awk '/^SUBLEVEL = /{print $3}' Makefile)
          KREL="${V}.${P}.${S}"
          echo "KREL=${KREL}" >> $GITHUB_ENV
          
          # 编译内核
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules dtbs 2>>"$ERR_FILE"
          
          # 安装模块
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               INSTALL_MOD_PATH=/tmp/kmod \
               INSTALL_MOD_STRIP=1 \
               KERNELRELEASE="${KREL}" \
               DEPMOD=true \
               modules_install
          
          # 编译无线驱动
          mkdir -p /tmp/kmod/lib/modules/${KREL}/kernel/drivers/aic8800
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=$PWD/../aicsrc/drivers/aic8800 modules 2>>"$ERR_FILE"
          find ../aicsrc/drivers/aic8800 -name '*.ko' -exec cp {} /tmp/kmod/lib/modules/${KREL}/kernel/drivers/aic8800/ \;
          depmod -b /tmp/kmod ${KREL}

      - name: 编译 usb_modeswitch 静态二进制
        run: |
          git clone --depth 1 https://github.com/libusb/libusb.git libusb-src || true
          if [ -d libusb-src ]; then
            cd libusb-src
            ./autogen.sh --host=aarch64-linux-gnu --enable-static --disable-shared --disable-udev --prefix=/tmp/usbroot >/dev/null
            make -j$(nproc) >/dev/null && make install >/dev/null
            cd ..
          fi
          curl -fsSL "https://www.draisberghof.de/usb_modeswitch/usb-modeswitch-2.6.1.tar.bz2" -o /tmp/ums.tar.bz2
          tar xjf /tmp/ums.tar.bz2 -C /tmp
          cd /tmp/usb-modeswitch-2.6.1
          aarch64-linux-gnu-gcc -static -O2 -o usb_modeswitch usb_modeswitch.c \
            -I/tmp/usbroot/include/libusb-1.0 -L/tmp/usbroot/lib -lusb-1.0 -lpthread 2>>"$ERR_FILE"
          cp usb_modeswitch "$OLDPWD/"

      - name: 编译 busybox 静态二进制 (用于自制 initramfs)
        run: |
          curl -fsSL "https://busybox.net/downloads/busybox-1.36.1.tar.bz2" | tar xj -C /tmp
          cd /tmp/busybox-1.36.1
          make defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/^CONFIG_STATIC=n/CONFIG_STATIC=y/' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) 2>>"$ERR_FILE"
          cp busybox "$OLDPWD/"

      - name: 打包内核并发布 Release (包含自制 initramfs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KV="${{ env.KV }}"
          KREL="${{ env.KREL }}"
          cd ksrc-src
          mkdir -p /tmp/rel/boot /tmp/rel/dtb
          cp arch/arm64/boot/Image /tmp/rel/boot/vmlinuz-${KV}
          cp .config /tmp/rel/boot/config-${KV}
          cp System.map /tmp/rel/boot/System.map-${KV}

          # === 自制 initramfs 制作开始 ===
          rm -rf /tmp/initrd && mkdir -p /tmp/initrd/bin /tmp/initrd/proc /tmp/initrd/sys /tmp/initrd/dev /tmp/initrd/mnt /tmp/initrd/lib/modules
          
          # 拷贝 busybox
          cp "$GITHUB_WORKSPACE/busybox" /tmp/initrd/bin/busybox
          for app in sh mount umount switch_root cat echo sleep modprobe; do
              ln -sf busybox /tmp/initrd/bin/$app
          done

          # 拷贝必要的内核模块到 initramfs (btrfs, usb-storage, ext4 等)
          cp -r /tmp/kmod/lib/modules/${KREL} /tmp/initrd/lib/modules/

          # 编写强健的 init 脚本
          cat > /tmp/initrd/init <<'EOF'
          #!/bin/sh
          PATH=/bin
          mount -t devtmpfs devtmpfs /dev 2>/dev/null
          mount -t proc proc /proc 2>/dev/null
          mount -t sysfs sysfs /sys 2>/dev/null
          
          echo "[initramfs] 加载存储与文件系统模块..."
          modprobe scsi_mod 2>/dev/null
          modprobe sd_mod 2>/dev/null
          modprobe usb-storage 2>/dev/null
          modprobe uas 2>/dev/null
          modprobe btrfs 2>/dev/null
          modprobe ext4 2>/dev/null

          echo "[initramfs] 等待根分区就绪 ..."
          sleep 3
          ROOT=""
          try_mount() {
              p="$1"
              # 尝试 btrfs 子卷 (ophub默认使用 ROOTFS 或 @)
              for opt in "subvol=ROOTFS" "subvol=@rootfs" "subvol=@"; do
                  mount -t btrfs -o "$opt" /dev/$p /mnt 2>/dev/null && return 0
              done
              # 尝试直接挂载 btrfs 或 ext4
              mount -t btrfs /dev/$p /mnt 2>/dev/null && return 0
              mount -t ext4 /dev/$p /mnt 2>/dev/null && return 0
              return 1
          }
          
          try_all() {
              # 覆盖 eMMC 和 U 盘可能的分区名
              for p in sda2 sdb2 sdc2 sdd2 mmcblk2p2 mmcblk2p3; do
                  [ -b /dev/$p ] || continue
                  if try_mount $p; then ROOT=$p; return 0; fi
              done
              return 1
          }
          
          try_all || { sleep 5; echo "[initramfs] 重试..."; try_all; }
          
          if [ -n "$ROOT" ] && [ -x /mnt/sbin/init ]; then
              echo "[initramfs] 成功挂载根分区: /dev/$ROOT"
              umount /proc /sys 2>/dev/null
              exec switch_root /mnt /sbin/init
          fi
          echo "[initramfs] 未找到可用的根分区, 进入急救 Shell"
          exec /bin/sh
          EOF
          chmod +x /tmp/initrd/init
          
          # 打包 initramfs
          (cd /tmp/initrd && find . | cpio -o -H newc 2>/dev/null | gzip -9) > /tmp/initrd.gz
          mkimage -A arm64 -O linux -T ramdisk -C gzip -d /tmp/initrd.gz /tmp/rel/boot/uInitrd-${KV}
          # === 自制 initramfs 制作结束 ===

          cp arch/arm64/boot/dts/amlogic/*.dtb /tmp/rel/dtb/
          cd /tmp/rel
          tar czf boot-${KV}.tar.gz --owner=0 --group=0 -C boot .
          tar czf dtb-amlogic-${KV}.tar.gz --owner=0 --group=0 -C dtb .
          tar czf modules-${KV}.tar.gz --owner=0 --group=0 -C /tmp/kmod/lib/modules ${{ env.KREL }}
          
          rm -rf /tmp/kv && mkdir -p /tmp/kv && tar xzf modules-${KV}.tar.gz -C /tmp/kv
          test "$(ls /tmp/kv | head -1)" = "${KV}" || { echo "模块目录名不一致"; exit 1; }
          
          mkdir -p wrap/${KV}
          mv boot-${KV}.tar.gz dtb-amlogic-${KV}.tar.gz modules-${KV}.tar.gz wrap/${KV}/
          cd wrap/${KV} && sha256sum *.tar.gz > sha256sums
          cd .. && tar czf ${KV}.tar.gz ${KV}
          
          gh release delete kernel_stable --cleanup-tag -y --repo ${{ github.repository }} 2>/dev/null || true
          gh release create kernel_stable ${KV}.tar.gz \
            --repo ${{ github.repository }} \
            -t "kernel_stable ${KV}" -n "CI custom kernel for N1 + AX900M"
          
          rm -rf "$GITHUB_WORKSPACE/ksrc-src" /tmp/kmod /tmp/k.tar.gz "$GITHUB_WORKSPACE/libusb-src"

      - name: 组装注入包
        run: |
          mkdir -p inject/opt/bin inject/lib/firmware \
                   inject/etc/usb_modeswitch.d inject/etc/custom_service \
                   inject/etc/hotplug.d/usb inject/etc/profile.d
          cp usb_modeswitch inject/opt/bin/ 2>/dev/null || true
          cp -r aicsrc/fw/. inject/lib/firmware/ 2>/dev/null || true
          find aicsrc -path '*modeswitch*' -type f ! -name '*.md' \
            -exec cp {} "inject/etc/usb_modeswitch.d/1111:1111" \; 2>/dev/null || true
          
          cat > inject/etc/hotplug.d/usb/99-aic8800 <<'EOF'
          #!/bin/sh
          [ "$ACTION" = "add" ] || exit 0
          case "$PRODUCT" in
              a69c:8d80*|a69c:8d83*)
                  modprobe aic_load_fw 2>/dev/null ;;
              a69c:8d81*|368b:8d81*)
                  modprobe cfg80211 2>/dev/null
                  modprobe aic8800_fdrv 2>/dev/null
                  modprobe aic_zlp_quirk 2>/dev/null
                  modprobe btusb 2>/dev/null ;;
          esac
          exit 0
          EOF
          chmod +x inject/etc/hotplug.d/usb/99-aic8800
          
          cat > inject/etc/custom_service/start_service.sh <<'EOF'
          #!/bin/sh
          i=0
          while [ $i -lt 40 ]; do
              lsusb | grep -qiE 'a69c|368b' && break
              if lsusb | grep -q "1111:1111"; then
                  usb_modeswitch -v 0x1111 -p 0x1111 \
                    -M 555342438765432100000000000010fd0000000000000000000000000000f3 \
                    -M 555342438765432100000000000010fd0000000000000000000000000000f2 >/dev/null 2>&1
              fi
              sleep 3; i=$((i+3))
          done
          exit 0
          EOF
          chmod +x inject/etc/custom_service/start_service.sh
          
          cat > inject/etc/profile.d/30-sysinfo.sh <<'EOF'
          #!/bin/sh
          echo "==================================="
          echo "  CPU 温度: $(( $(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || echo 0) / 1000 ))°C"
          echo "==================================="
          EOF
          rm -rf aicsrc

      - name: 准备中文语言包(离线注入)
        run: |
          mkdir -p inject/opt/ipks inject/etc/uci-defaults
          REL="${{ github.event.inputs.openwrt_version }}"
          REL="${REL#v}"
          REPO="https://downloads.openwrt.org/releases/${REL}/packages/aarch64_generic"
          download_ipk() {
            local sub="$1" pkg="$2" file
            file=$(curl -fsSL "${REPO}/${sub}/Packages.gz" | gunzip \
                   | awk -v p="${pkg}_" '$1=="Filename:" && $2 ~ p {print $2; exit}' || true)
            case "$file" in */*) ;; *) file="${sub}/${file}" ;; esac
            if [ -n "$file" ]; then
              curl -fsSL "${REPO}/${file}" -o "inject/opt/ipks/${pkg}.ipk" && echo ">>> 已下载 ${pkg}" || echo ">>> 下载失败 ${pkg}"
            fi
          }
          download_ipk luci luci-i18n-base-zh-cn
          download_ipk luci luci-i18n-firewall-zh-cn
          download_ipk luci luci-i18n-mwan3-zh-cn
          
          cat > inject/etc/uci-defaults/99-zh-cn <<'EOF'
          #!/bin/sh
          opkg install /opt/ipks/luci-i18n-*.ipk 2>/dev/null
          opkg install --force-reinstall /opt/ipks/luci-i18n-*.ipk 2>/dev/null
          for d in /usr/sbin /usr/bin /sbin /bin; do
              cp /opt/bin/usb_modeswitch "$d/" 2>/dev/null
          done
          uci set luci.main.lang='zh_cn' 2>/dev/null && uci commit luci 2>/dev/null
          exit 0
          EOF
          chmod +x inject/etc/uci-defaults/99-zh-cn

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.openwrt_version }} \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_bluez-daemon=y
          CONFIG_PACKAGE_bluez-utils=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y
          EOF
          sed -i 's/^          //' .config
          make defconfig

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译 OpenWrt rootfs
        run: |
          cd openwrt
          if ! make -j$(nproc) 2>>"$ERR_FILE"; then
            make -j1 V=s 2>>"$ERR_FILE"
          fi

      - name: 升级 coreutils
        run: |
          curl -fsSL https://ftp.gnu.org/gnu/coreutils/coreutils-9.9.tar.xz | tar xJ
          cd coreutils-9.9
          ./configure --quiet >/dev/null
          make -j$(nproc) >/dev/null
          sudo make install >/dev/null
          hash -r

      - name: 打包 N1 固件
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/*/*/*rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ${{ github.repository }}
          openwrt_kernel: ${{ env.KV }}
          auto_kernel: false
          openwrt_files: inject

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-AX900M
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          if-no-files-found: error

      - name: 上传错误日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: ${{ github.workspace }}/error_log.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: 构建结果推送到钉钉
        if: always()
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ERR_FILE="$GITHUB_WORKSPACE/error_log.txt"
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="[openwrt N1] ✅ 构建成功"
            CONTENT="固件已编译完成，去 Actions 下载 N1-OpenWrt-AX900M 刷机即可。"
          else
            TITLE="[openwrt N1] ❌ 构建失败"
            ERR_SUMMARY=""
            if [ -f "$ERR_FILE" ]; then
              ERR_SUMMARY=$(grep '❌' "$ERR_FILE" | tail -5 | sed 's/$/\\n/g' | tr -d '\n')
            fi
            if [ -n "$ERR_SUMMARY" ]; then
              CONTENT="错误摘要:\\n${ERR_SUMMARY}\\n请查看 Artifacts 中的 build-error-log。"
            else
              CONTENT="请到 Actions 查看失败步骤日志。"
            fi
          fi
          curl -sS -X POST \
            "https://oapi.dingtalk.com/robot/send?access_token=${{ secrets.DINGTALK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"${TITLE}\\n${CONTENT}\\n${RUN_URL}\"}}" || true
